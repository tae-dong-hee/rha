user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format rha '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent scheme=$scheme duration=$request_time';
    access_log /var/log/nginx/rha-access.log rha;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    include /etc/nginx/conf.d/*.conf;
}
