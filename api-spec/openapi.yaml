openapi: 3.0.3
info:
  title: Core Service API
  version: 1.0.0
  description: |
    [작성 규칙]
    - 모든 operation에 operationId(camelCase)와 tags 필수
    - URL은 복수형 명사 + kebab-case (예: /travel-courses)
    - 목록 응답은 { content, pageInfo } 형태
      - 항목 수가 고정되었거나 적은 설정성 응답(영업시간, 권한 목록, 회원 보유 권한, 수당 단가, 활동 이력 카테고리)은 페이징 없이 해당 이름의 배열 필드로 반환한다.
    - 인증 불필요 API는 security: [] 로 명시
    - 날짜/시간은 ISO 8601 (UTC)

servers:
  - url: http://localhost:8080/v1
    description: Local Server
  - url: https://api.example.com/v1
    description: Production Server

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: |
      인증 (회원가입, 로그인, 토큰, 이메일 인증, 비밀번호 재설정).
      Access Token은 응답 body로, Refresh Token은 HttpOnly 쿠키로 주고받는다.
  - name: Member
    description: 내 정보 (로그인한 본인)
  - name: MemberAdmin
    description: 회원 관리 (관리자 전용). 회원, 강사, 관리자 등록과 역할, 상태 변경은 항상 관리자만 할 수 있다.
  - name: Instructor
    description: |
      강사 관리 (담당 강사 선택용 목록, 수업 가능시간, 퇴사, 수업 인계).
      수업 가능시간 설정, 퇴사, 수업 인계는 관리자 전용이다. 가능시간은 관리자 또는 해당 강사 본인만 조회할 수 있다.
  - name: Absence
    description: |
      강사 부재 (휴가 등으로 수업을 할 수 없는 기간).
      강사가 신청하고 관리자가 승인하거나 반려한다. 승인된 부재 기간에는 그 강사에게 수업을 배정할 수 없다.
  - name: Permission
    description: |
      권한 (관리자 전용).
      관리자(`ADMIN`)는 모든 권한을 암묵적으로 가진다. 권한은 강사(`INSTRUCTOR`)에게만 부여할 수 있고, 부여는 관리자만 한다.
      서버가 요청마다 보유 권한을 확인하므로 변경은 즉시 반영된다 (토큰 재발급 불필요). 권한이 없으면 403 (PERMISSION_DENIED).
  - name: Lesson
    description: 수업 (개설, 수정, 공개 상태 관리). 개설, 수정, 공개 상태 변경, 취소는 관리자 또는 해당 수업 유형의 권한을 가진 강사만 할 수 있다.
  - name: PassProduct
    description: 이용권 상품 (이름, 가격, 횟수, 유효 기간을 정의한 템플릿). 관리자 전용.
  - name: Pass
    description: 이용권 (회원에게 발급된 개별 이용권, 일시정지). 관리자 전용이며, 회원은 본인의 이용권만 조회할 수 있다.
  - name: Payment
    description: |
      결제 기록 (관리자 전용). 센터에서 오프라인으로 받은 결제를 기록만 하며, 시스템이 실제 결제를 처리하지는 않는다.
      환불도 환불 여부를 체크해 기록만 한다. 이용권, 예약, 미수금은 환불 체크로 자동 변경되지 않는다.
  - name: Reservation
    description: 예약과 출결. 예약은 회원만 할 수 있고(대리 예약 없음), 출결은 관리자 또는 해당 수업의 담당 강사만 기록할 수 있다.
  - name: ReservationPolicy
    description: 예약 정책 (취소 가능 시간 등). 설정은 관리자 전용, 조회는 로그인한 모든 사용자.
  - name: ActivityLog
    description: |
      활동 이력 (관리자 전용).
      - 조회를 제외한 모든 쓰기 동작(생성, 수정, 삭제, 상태 변경)과 보안 이벤트(로그인 성공/실패, 비밀번호 변경, 권한 부여, 역할 변경)는 서버가 자동으로 기록한다. 각 API가 이력을 따로 반환하지는 않는다.
      - 행위자(회원, 강사, 관리자), 행위 종류(카테고리와 행위 코드), 대상, 영향받은 회원, 변경 전후 값이 담긴다. 스케줄러의 자동 처리(공개 예약 시각의 자동 공개, 이용권 만료)는 행위자 없이(시스템) 기록된다.
      - 이력은 업무 변경과 같은 트랜잭션에서 기록되며, 수정하거나 삭제할 수 없다. 알림 읽음 처리는 기록하지 않는다.
      - 비밀번호와 토큰은 절대 기록하지 않는다. 전화번호, 주소, 생년월일 같은 개인정보는 변경 사실만 남기고 값은 마스킹한다.
  - name: Notification
    description: 알림 (시스템 내 인앱 알림, 웹푸시는 추후)
  - name: PayRate
    description: 강사 수당 단가 (강사별, 수업 유형별). 관리자 전용.
  - name: Settlement
    description: 강사 정산. 관리자 전용이며, 강사가 본인 수업 내역을 확인하는 기능은 추후 정의한다.
  - name: LessonType
    description: "수업 유형 (예: 개인, 단체 3:1). 등록과 수정은 관리자 전용, 조회는 로그인한 모든 사용자."
  - name: Room
    description: 룸 (수업이 열리는 공간). 등록, 수정, 삭제는 관리자 전용, 조회는 로그인한 모든 사용자.
  - name: BusinessHour
    description: 영업시간. 설정은 관리자 전용, 조회는 로그인한 모든 사용자.

paths:
  # ===== 이메일 인증 =====
  /auth/email-verifications:
    post:
      tags: [Auth]
      operationId: requestEmailVerification
      summary: 이메일 인증 코드 발송
      description: |
        회원가입 전 이메일 소유 확인을 위해 인증 코드를 발송한다.
        - 이미 가입된 이메일이면 409 (EMAIL_ALREADY_EXISTS)
        - 코드 유효 시간은 서버 정책을 따른다. 재요청 시 이전 코드는 무효화된다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '204':
          description: 발송 성공
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/email-verifications/confirm:
    post:
      tags: [Auth]
      operationId: confirmEmailVerification
      summary: 이메일 인증 코드 확인
      description: |
        코드가 일치하면 회원가입에 사용할 `emailVerificationToken`을 발급한다.
        - 코드 불일치/만료 시 400 (INVALID_VERIFICATION_CODE)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
      responses:
        '200':
          description: 인증 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 회원가입 / 로그인 / 토큰 =====
  /auth/sign-up:
    post:
      tags: [Auth]
      operationId: signUp
      summary: 회원가입
      description: |
        이메일 인증이 완료된 `emailVerificationToken`이 필요하다.
        - 가입자는 항상 `MEMBER` 역할로 생성된다 (요청에서 역할을 지정할 수 없다).
        - 토큰이 유효하지 않거나 요청 이메일과 다르면 400 (INVALID_VERIFICATION_TOKEN)
        - 이미 가입된 이메일이면 409 (EMAIL_ALREADY_EXISTS)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: 가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 로그인
      description: |
        성공 시 Access Token은 body로, Refresh Token은 HttpOnly 쿠키(Set-Cookie)로 내려간다.
        - 이메일 또는 비밀번호 불일치 시 401 (INVALID_CREDENTIALS). 어느 쪽이 틀렸는지는 알려주지 않는다.
        - 탈퇴, 비활성화, 퇴사한 계정은 로그인할 수 없다 (401, ACCOUNT_DISABLED).
        - 관리자가 초대했지만 아직 비밀번호를 설정하지 않은 계정도 로그인할 수 없다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: 토큰 재발급
      description: |
        `refreshToken` 쿠키로 Access Token을 재발급한다. Refresh Token도 함께 회전(rotation)되어 새 쿠키로 내려간다.
        - 쿠키가 없거나 만료/폐기된 토큰이면 401 (INVALID_REFRESH_TOKEN)
      security: []
      parameters:
        - name: refreshToken
          in: cookie
          required: true
          description: 로그인 시 발급된 Refresh Token (HttpOnly 쿠키, 브라우저가 자동 전송)
          schema:
            type: string
      responses:
        '200':
          description: 재발급 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃
      description: 서버에서 Refresh Token을 폐기하고, 쿠키를 만료시킨다(Max-Age=0).
      parameters:
        - name: refreshToken
          in: cookie
          required: false
          description: 폐기할 Refresh Token (HttpOnly 쿠키, 브라우저가 자동 전송)
          schema:
            type: string
      responses:
        '204':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: Refresh Token 쿠키 삭제 (`refreshToken=; Max-Age=0; Path=/v1/auth`)
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 비밀번호 찾기 (재설정) =====
  /auth/password-reset-requests:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: 비밀번호 재설정 메일 요청
      description: |
        가입된 이메일이면 재설정 링크(토큰 포함)를 발송한다. 초대 메일이 만료된 계정도 이 API로 다시 설정 링크를 받을 수 있다.
        계정 존재 여부 노출을 막기 위해, 가입 여부와 관계없이 항상 204를 반환한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: 요청 접수 (가입 여부와 무관하게 동일 응답)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/password-resets:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: 비밀번호 재설정
      description: |
        메일로 받은 토큰과 새 비밀번호로 비밀번호를 변경한다. 성공 시 기존 Refresh Token은 모두 폐기된다.
        관리자 초대 메일의 비밀번호 설정 링크도 같은 토큰 흐름을 사용한다 (최초 비밀번호 설정).
        - 토큰이 유효하지 않거나 만료되면 400 (INVALID_RESET_TOKEN)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: 변경 성공
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 내 정보 / 회원탈퇴 =====
  /members/me:
    get:
      tags: [Member]
      operationId: getMyProfile
      summary: 내 정보 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Member]
      operationId: updateMyProfile
      summary: 내 정보 수정
      description: |
        전달한 필드만 수정한다 (부분 수정). 최소 1개 필드가 필요하다.
        - 이메일은 로그인 아이디이므로 변경할 수 없다.
        - `address`에 null을 보내면 주소를 삭제한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateRequest'
      responses:
        '200':
          description: 수정 성공 (수정된 회원 정보)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Member]
      operationId: withdrawMyAccount
      summary: 회원탈퇴
      description: |
        로그인한 회원을 탈퇴 처리한다 (soft delete). `MEMBER` 역할만 가능하다.
        - `INSTRUCTOR`/`ADMIN`은 스스로 탈퇴할 수 없으며 403 (FORBIDDEN_ROLE). 관리자가 상태를 변경해야 한다.
        - 시작 전 예약(`RESERVED`)이 있으면 탈퇴할 수 없다 (409, MEMBER_HAS_UPCOMING_RESERVATIONS). 예약을 먼저 취소해야 한다.
        - 남은 이용권은 탈퇴와 함께 사용할 수 없게 된다 (이력은 보존된다).
        - 이용권/결제 이력 등 연관 데이터는 보존되고, 계정 상태는 `WITHDRAWN`이 된다. 같은 이메일로 다시 가입할 수 없으며, 필요하면 관리자가 `changeMemberStatus`로 `ACTIVE`로 복구한다.
        - 모든 Refresh Token이 폐기되고 쿠키가 만료된다.
      responses:
        '204':
          description: 탈퇴 성공
          headers:
            Set-Cookie:
              description: Refresh Token 쿠키 삭제 (`refreshToken=; Max-Age=0; Path=/v1/auth`)
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/me/password:
    put:
      tags: [Member]
      operationId: changeMyPassword
      summary: 비밀번호 변경
      description: |
        현재 비밀번호를 확인한 뒤 새 비밀번호로 변경한다. 성공 시 기존 Refresh Token은 모두 폐기되며,
        현재 기기도 다시 로그인해야 한다.
        - 현재 비밀번호가 틀리면 400 (INVALID_CURRENT_PASSWORD).
          401을 쓰지 않는 이유는 토큰 만료로 오인되어 재발급 로직이 동작하는 것을 막기 위함이다.
        - 새 비밀번호가 현재 비밀번호와 같으면 400 (SAME_AS_CURRENT_PASSWORD)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 변경 성공
          headers:
            Set-Cookie:
              description: Refresh Token 쿠키 삭제 (`refreshToken=; Max-Age=0; Path=/v1/auth`)
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 회원 관리 (관리자 전용) =====
  /members:
    get:
      tags: [MemberAdmin]
      operationId: getMembers
      summary: 회원 목록 조회 (관리자 또는 MEMBER_READ)
      description: |
        관리자 또는 `MEMBER_READ` 권한을 가진 강사만 가능하다 (없으면 403, PERMISSION_DENIED). 최신 가입순으로 정렬된다.
        - `keyword`는 이름 또는 이메일에 부분 일치한다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: role
          in: query
          description: 역할 필터
          required: false
          schema:
            $ref: '#/components/schemas/MemberRole'
        - name: status
          in: query
          description: 계정 상태 필터
          required: false
          schema:
            $ref: '#/components/schemas/MemberStatus'
        - name: keyword
          in: query
          description: 이름 또는 이메일 검색어
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [MemberAdmin]
      operationId: createMember
      summary: 강사/관리자 등록 (관리자)
      description: |
        관리자 전용. 강사 또는 관리자 계정을 등록한다.
        - 비밀번호 없이 등록하며, 입력한 이메일로 비밀번호 설정 링크(초대 메일)가 발송된다.
        - 설정 링크는 `resetPassword`(POST /auth/password-resets)로 처리한다. 링크가 만료되면 `requestPasswordReset`으로 다시 받을 수 있다.
        - 비밀번호를 설정하기 전까지는 로그인할 수 없다.
        - 이미 가입된 이메일이면 409 (EMAIL_ALREADY_EXISTS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreateRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/MemberIdPath'
    get:
      tags: [MemberAdmin]
      operationId: getMember
      summary: 회원 상세 조회 (관리자 또는 MEMBER_READ)
      description: 관리자 또는 `MEMBER_READ` 권한을 가진 강사만 가능하다 (없으면 403, PERMISSION_DENIED).
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [MemberAdmin]
      operationId: updateMember
      summary: 회원 정보 수정 (관리자)
      description: |
        관리자 전용. 전달한 필드만 수정한다 (부분 수정). 최소 1개 필드가 필요하다.
        - 이메일은 변경할 수 없다.
        - 본인의 역할은 변경할 수 없다 (403, CANNOT_CHANGE_OWN_ROLE). 마지막 관리자가 사라지는 것을 막기 위함이다.
        - 역할이 바뀌면 해당 회원의 Refresh Token은 폐기된다.
        - 강사(`INSTRUCTOR`)의 역할을 다른 역할로 바꾸려는데 시작 전이고 취소되지 않은 담당 수업이 있으면 409 (INSTRUCTOR_HAS_UPCOMING_LESSONS). 담당 강사를 바꾸거나 수업을 취소한 뒤 다시 시도한다.
        - 강사에게 부여된 권한은 역할이 바뀌면 모두 회수된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAdminUpdateRequest'
      responses:
        '200':
          description: 수정 성공 (수정된 회원 정보)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/{memberId}/status:
    parameters:
      - $ref: '#/components/parameters/MemberIdPath'
    put:
      tags: [MemberAdmin]
      operationId: changeMemberStatus
      summary: 회원 상태 변경 (관리자)
      description: |
        관리자 전용. 계정을 활성화(`ACTIVE`) 또는 비활성화(`INACTIVE`)한다. 예: 강사 퇴사 처리
        - 비활성화되면 로그인할 수 없고 Refresh Token이 모두 폐기된다. 연관 데이터는 보존된다.
        - 비활성화하려는 강사에게 시작 전이고 취소되지 않은 수업이 있으면 409 (INSTRUCTOR_HAS_UPCOMING_LESSONS). 담당 강사를 바꾸거나 수업을 취소한 뒤 다시 시도한다.
        - 본인 계정의 상태는 변경할 수 없다 (403, CANNOT_CHANGE_OWN_STATUS).
        - 탈퇴(`WITHDRAWN`)하거나 퇴사(`RESIGNED`)한 계정은 `ACTIVE`로만 되돌릴 수 있다. 이용권, 수업, 이력 등 데이터는 삭제되지 않고 보존되어 있어 그대로 이어진다. `INACTIVE`로 바꾸려 하면 409 (MEMBER_WITHDRAWN, 퇴사한 강사는 MEMBER_RESIGNED).
        - 퇴사한 강사를 복구하면 퇴사일이 지워진다. 퇴사 처리 때 회수된 권한은 복구되지 않으므로 필요하면 다시 부여한다. 수업 가능시간은 그대로 남아 있다. 퇴사는 `completeResignation`으로 처리한다.
        - 비활성화하려는 회원에게 시작 전 예약(`RESERVED`)이 있으면 409 (MEMBER_HAS_UPCOMING_RESERVATIONS). 예약을 먼저 취소해야 한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberStatusChangeRequest'
      responses:
        '200':
          description: 변경 성공 (변경된 회원 정보)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 권한 =====
  /permissions:
    get:
      tags: [Permission]
      operationId: getPermissions
      summary: 부여 가능한 권한 목록 조회 (관리자)
      description: |
        관리자 전용. 현재 부여 가능한 모든 권한을 반환한다. 활성 상태인 수업 유형별 권한도 포함된다.
        관리자 화면에서 체크박스 목록을 한 번에 그리기 위해 페이징을 사용하지 않는다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/{memberId}/permissions:
    parameters:
      - $ref: '#/components/parameters/MemberIdPath'
    get:
      tags: [Permission]
      operationId: getMemberPermissions
      summary: 회원의 보유 권한 조회 (관리자)
      description: |
        관리자 전용. 명시적으로 부여된 권한만 반환한다. 관리자 계정은 암묵적으로 모든 권한을 가지므로 빈 목록이 반환된다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPermissionsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [Permission]
      operationId: updateMemberPermissions
      summary: 회원 권한 설정 (관리자)
      description: |
        관리자 전용. 보유 권한 목록을 전달한 목록으로 통째로 교체한다. 빈 배열이면 모든 권한을 회수한다.
        - 대상이 강사(`INSTRUCTOR`)가 아니면 400 (PERMISSION_TARGET_INVALID)
        - 목록에 없는 권한 코드이거나 중복이면 400 (INVALID_PERMISSION)
        - 변경은 즉시 반영된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPermissionsRequest'
      responses:
        '200':
          description: 설정 성공 (저장된 권한)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPermissionsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 수업 유형 =====
  /lesson-types:
    get:
      tags: [LessonType]
      operationId: getLessonTypes
      summary: 수업 유형 목록 조회
      description: 등록 순으로 정렬된다. `active`를 지정하지 않으면 활성/비활성 유형을 모두 반환한다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: active
          in: query
          description: 활성 여부 필터
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonTypePageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [LessonType]
      operationId: createLessonType
      summary: 수업 유형 등록 (관리자)
      description: |
        관리자 전용. 등록하면 해당 유형의 권한(`LESSON_CREATE:{code}`, `LESSON_UPDATE:{code}`)이 권한 목록에 추가된다.
        수업의 `capacity`는 개설 시점의 유형 정원이 복사된다.
        - 이미 같은 `code`가 있으면 409 (LESSON_TYPE_CODE_DUPLICATED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonTypeCreateRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonType'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /lesson-types/{lessonTypeId}:
    parameters:
      - $ref: '#/components/parameters/LessonTypeIdPath'
    patch:
      tags: [LessonType]
      operationId: updateLessonType
      summary: 수업 유형 수정 (관리자)
      description: |
        관리자 전용. 전달한 필드만 수정한다 (부분 수정). 최소 1개 필드가 필요하다.
        - `code`는 변경할 수 없다 (권한 코드에 쓰이기 때문).
        - 정원(`capacity`)을 바꿔도 이미 개설된 수업의 정원은 바뀌지 않는다.
        - `active`를 false로 하면 새 수업을 개설할 수 없고, 권한 목록에서도 제외된다. 기존 수업과 부여된 권한은 유지된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonTypeUpdateRequest'
      responses:
        '200':
          description: 수정 성공 (수정된 수업 유형)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonType'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 수업 =====
  /lessons:
    get:
      tags: [Lesson]
      operationId: getLessons
      summary: 수업 목록 조회
      description: |
        시작 시각(`startAt`) 기준으로 정렬하며, 방향은 `order`로 지정한다 (기본 ASC). `from` 이상 `to` 미만에 시작하는 수업을 조회한다.
        일/월/년 단위 조회는 `from`/`to` 범위로 표현한다. 하루의 경계는 센터 현지 시각(Asia/Seoul) 자정이므로, 클라이언트가 이를 UTC로 변환해 전달한다.
        노출 범위는 역할에 따라 다르다.
        - 관리자: 모든 수업
        - 강사: 공개된(`PUBLISHED`) 수업 + 본인이 담당하는 수업 + `LESSON_CREATE`/`LESSON_UPDATE` 권한이 있는 유형의 수업
        - 회원: 공개된(`PUBLISHED`) 수업만 (`status`로 다른 상태를 지정해도 결과에 나오지 않는다)
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: from
          in: query
          description: 조회 시작 시각 (UTC, 포함)
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 조회 종료 시각 (UTC, 미포함). `from`보다 늦어야 한다.
          required: false
          schema:
            type: string
            format: date-time
        - name: lessonTypeId
          in: query
          description: 수업 유형 필터
          required: false
          schema:
            type: integer
            format: int64
        - name: instructorId
          in: query
          description: 담당 강사 필터
          required: false
          schema:
            type: integer
            format: int64
        - name: roomId
          in: query
          description: 룸 필터
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: 상태 필터
          required: false
          schema:
            $ref: '#/components/schemas/LessonStatus'
        - name: order
          in: query
          description: 시작 시각 정렬 방향 (ASC 오름차순, DESC 내림차순)
          required: false
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Lesson]
      operationId: createLesson
      summary: 수업 개설 (LESSON_CREATE)
      description: |
        관리자 또는 해당 유형의 `LESSON_CREATE:{유형코드}` 권한을 가진 강사만 가능하다 (없으면 403, PERMISSION_DENIED).
        개설된 수업은 `CREATED` 상태(비공개)이며, 정원은 유형의 정원이 복사된다. 담당 강사는 본인이 아니어도 지정할 수 있다.
        - `endAt`이 `startAt`보다 늦지 않거나 `startAt`이 과거이면 400 (INVALID_LESSON_TIME)
        - 비활성 수업 유형이면 400 (LESSON_TYPE_INACTIVE)
        - 담당 강사가 활성 상태의 강사(`INSTRUCTOR`)가 아니면 400 (INVALID_INSTRUCTOR)
        - 수업 유형 또는 룸이 없으면 404
        - 영업시간 밖이거나 휴무일이면 409 (OUTSIDE_BUSINESS_HOURS)
        - 담당 강사의 수업 가능시간 밖이면 409 (INSTRUCTOR_UNAVAILABLE). 가능시간이 설정되지 않은 강사에게는 수업을 배정할 수 없다.
        - 담당 강사의 승인된 부재 기간과 겹치면 409 (INSTRUCTOR_ABSENT)
        - 퇴사일이 등록된 강사에게 퇴사일 이후(수업일이 퇴사일과 같거나 이후)의 수업을 배정하면 409 (INSTRUCTOR_RESIGNING)
        - 같은 시간에 담당 강사의 다른 수업이 있으면 409 (INSTRUCTOR_TIME_CONFLICT). 수업 유형이 개인인지 그룹인지와 무관하게 검사한다.
        - 같은 시간에 같은 룸에 다른 수업이 있으면 409 (ROOM_TIME_CONFLICT)
        - 취소된(`CANCELED`) 수업은 시간 충돌로 보지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCreateRequest'
      responses:
        '201':
          description: 개설 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /lessons/{lessonId}:
    parameters:
      - $ref: '#/components/parameters/LessonIdPath'
    get:
      tags: [Lesson]
      operationId: getLesson
      summary: 수업 상세 조회
      description: 노출 범위는 목록 조회와 같다. 볼 수 없는 수업은 존재 여부를 숨기기 위해 404를 반환한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Lesson]
      operationId: updateLesson
      summary: 수업 수정 (LESSON_UPDATE)
      description: |
        관리자 또는 해당 수업 유형의 `LESSON_UPDATE:{유형코드}` 권한을 가진 강사만 가능하다 (없으면 403, PERMISSION_DENIED).
        전달한 필드만 수정한다 (부분 수정). 최소 1개 필드가 필요하다.
        - 수업 유형은 변경할 수 없다 (권한 범위가 달라지기 때문).
        - 시간, 강사, 룸을 바꾸면 개설과 같은 검증(INVALID_LESSON_TIME, INVALID_INSTRUCTOR, OUTSIDE_BUSINESS_HOURS, INSTRUCTOR_UNAVAILABLE, INSTRUCTOR_ABSENT, INSTRUCTOR_RESIGNING, INSTRUCTOR_TIME_CONFLICT, ROOM_TIME_CONFLICT)을 다시 한다. 자기 자신과는 충돌로 보지 않는다.
        - 이미 시작한 수업은 수정할 수 없다 (409, LESSON_ALREADY_STARTED).
        - 취소된 수업은 수정할 수 없다 (409, LESSON_CANCELED).
        - 공개 예약(`SCHEDULED`) 중인 수업의 시작 시각(`startAt`)을 `publishAt`보다 앞으로 옮기면 400 (INVALID_PUBLISH_AT). 먼저 공개 예약을 변경하거나 취소(`UNPUBLISHED`)해야 한다.
        - 예약(`RESERVED`)이 있는 수업은 시작/종료 시각을 변경할 수 없다 (409, LESSON_HAS_RESERVATIONS). 시간을 바꾸려면 수업을 취소하고 다시 개설한다.
        - 예약이 있어도 제목, 강사, 룸은 변경할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonUpdateRequest'
      responses:
        '200':
          description: 수정 성공 (수정된 수업)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /lessons/{lessonId}/status:
    parameters:
      - $ref: '#/components/parameters/LessonIdPath'
    put:
      tags: [Lesson]
      operationId: changeLessonStatus
      summary: 수업 공개 상태 변경 (LESSON_UPDATE)
      description: |
        관리자 또는 해당 수업 유형의 `LESSON_UPDATE:{유형코드}` 권한을 가진 강사만 가능하다 (없으면 403, PERMISSION_DENIED).
        - `PUBLISHED`: 즉시 공개
        - `UNPUBLISHED`: 비공개. 공개 예약(`SCHEDULED`)을 취소할 때도 사용한다.
        - `SCHEDULED`: 공개 예약. `publishAt`이 필수이며, 그 시각이 되면 서버가 자동으로 `PUBLISHED`로 바꾼다.
        - 허용되는 상태 전이는 다음과 같다. 그 외는 409 (INVALID_STATUS_TRANSITION).
          - `CREATED` → `PUBLISHED`, `SCHEDULED`
          - `SCHEDULED` → `PUBLISHED`, `UNPUBLISHED`, `SCHEDULED` (예약 시각 변경)
          - `PUBLISHED` → `UNPUBLISHED`
          - `UNPUBLISHED` → `PUBLISHED`, `SCHEDULED`
        - `SCHEDULED`인데 `publishAt`이 없거나, 과거이거나, 수업 시작 시각(`startAt`) 이후이면 400 (INVALID_PUBLISH_AT). `SCHEDULED`가 아닌데 `publishAt`을 보내도 400이다.
        - 이미 시작한 수업은 공개할 수 없다 (409, LESSON_ALREADY_STARTED).
        - 취소된 수업은 상태를 바꿀 수 없다 (409, LESSON_CANCELED). 수업 취소는 `cancelLesson`을 사용한다.
        - 예약이 있는 수업을 비공개(`UNPUBLISHED`)로 바꿔도 기존 예약은 유지되고, 신규 예약만 막힌다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonStatusChangeRequest'
      responses:
        '200':
          description: 변경 성공 (변경된 수업)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /lessons/{lessonId}/cancellations:
    parameters:
      - $ref: '#/components/parameters/LessonIdPath'
    post:
      tags: [Lesson]
      operationId: cancelLesson
      summary: 수업 취소 (LESSON_UPDATE)
      description: |
        관리자 또는 해당 수업 유형의 `LESSON_UPDATE:{유형코드}` 권한을 가진 강사만 가능하다 (없으면 403, PERMISSION_DENIED).
        수업을 없애는 되돌릴 수 없는 처리이며, 상태는 `CANCELED`가 된다. 비공개(`UNPUBLISHED`)와 달리 다시 공개할 수 없다.
        - 담당 강사와 룸의 시간 점유가 해제되어 같은 시간에 새 수업을 개설할 수 있다.
        - 공개 상태와 관계없이 취소할 수 있다 (`CREATED`, `SCHEDULED`, `PUBLISHED`, `UNPUBLISHED`).
        - 이미 시작한 수업은 취소할 수 없다 (409, LESSON_ALREADY_STARTED).
        - 이미 취소된 수업이면 409 (LESSON_CANCELED).
        - 수업의 모든 예약(`RESERVED`)이 함께 취소된다 (취소 시간 정책과 무관). 예약의 `canceledBy`는 `LESSON_CANCELED`이다.
        - 취소된 예약에 사용된 이용권의 잔여 횟수가 1회씩 복구된다 (만료된 이용권도 횟수만 증가하고 기간은 바뀌지 않는다).
        - 취소된 예약의 회원에게 인앱 알림이 발송된다.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCancelRequest'
      responses:
        '200':
          description: 취소 성공 (취소된 수업)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 이용권 상품 =====
  /pass-products:
    get:
      tags: [PassProduct]
      operationId: getPassProducts
      summary: 이용권 상품 목록 조회 (관리자)
      description: 관리자 전용. 등록 최신순으로 정렬된다. `keyword`는 상품 이름에 부분 일치한다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: keyword
          in: query
          description: 상품 이름 검색어
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassProductPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [PassProduct]
      operationId: createPassProduct
      summary: 이용권 상품 등록 (관리자)
      description: |
        관리자 전용. 담당 강사는 상품에 포함되지 않는다 (회원에게 발급할 때 지정한다).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassProductCreateRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassProduct'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pass-products/{passProductId}:
    parameters:
      - $ref: '#/components/parameters/PassProductIdPath'
    get:
      tags: [PassProduct]
      operationId: getPassProduct
      summary: 이용권 상품 상세 조회 (관리자)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassProduct'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [PassProduct]
      operationId: updatePassProduct
      summary: 이용권 상품 수정 (관리자)
      description: |
        관리자 전용. 전달한 필드만 수정한다 (부분 수정). 최소 1개 필드가 필요하다.
        이미 발급된 이용권에 미치는 영향은 필드마다 다르다.
        - `name`, `description`: 발급된 이용권에도 즉시 반영된다 (표시용 정보).
        - `price`: 이미 발급된 이용권에는 영향이 없다 (발급 시점의 가격이 기록으로 남는다).
        - `totalCount`, `validityDays`: 기본적으로 앞으로 발급하는 이용권부터 적용된다.
          `applyToIssued`를 true로 보내면 이 상품으로 발급된 이용권 중 만료되지 않은(`UPCOMING`, `ACTIVE`) 모든 이용권에도 반영된다.
          - 총 횟수가 변경되면 변경된 만큼 이용권의 총 횟수와 잔여 횟수를 함께 증감한다. 잔여 횟수는 0 미만이 되지 않는다.
          - 유효 기간이 변경되면 만료일을 `시작일 + 유효 기간 - 1일`로 다시 계산한다. 개별 수정한 만료일은 덮어써진다. 새 만료일이 과거이면 해당 이용권은 `EXPIRED`가 된다.
        - `applyToIssued`는 보유 회원 전체에 영향을 주므로, 클라이언트는 영향받는 이용권 수를 먼저 확인시킨 뒤 호출해야 한다. 영향 수는 `GET /passes?passProductId=...`의 `pageInfo.totalElements`로 알 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassProductUpdateRequest'
      responses:
        '200':
          description: 수정 성공 (수정된 상품과 영향받은 이용권 수)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassProductUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [PassProduct]
      operationId: deletePassProduct
      summary: 이용권 상품 삭제 (관리자)
      description: |
        관리자 전용.
        - 이 상품으로 발급된 이용권이 하나라도 있으면 삭제할 수 없다 (409, PASS_PRODUCT_IN_USE).
      responses:
        '204':
          description: 삭제 성공
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 이용권 =====
  /passes:
    get:
      tags: [Pass]
      operationId: getPasses
      summary: 이용권 목록 조회 (관리자)
      description: |
        관리자 전용. 정렬 기준은 `sortBy`, 방향은 `order`로 지정한다 (기본은 등록일 내림차순).
        - `keyword`는 회원 이름에 부분 일치한다.
        - 등록일 범위는 `createdFrom` 이상 `createdTo` 미만이다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: memberId
          in: query
          description: 회원 필터
          required: false
          schema:
            type: integer
            format: int64
        - name: keyword
          in: query
          description: 회원 이름 검색어
          required: false
          schema:
            type: string
            maxLength: 50
        - name: instructorId
          in: query
          description: 담당 강사 필터
          required: false
          schema:
            type: integer
            format: int64
        - name: passProductId
          in: query
          description: 이용권 상품 필터
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: 상태 필터
          required: false
          schema:
            $ref: '#/components/schemas/PassStatus'
        - name: paymentStatus
          in: query
          description: 결제 상태 필터 (미수 이용권 조회에 사용한다)
          required: false
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - name: createdFrom
          in: query
          description: 등록 시각 범위 시작 (UTC, 포함)
          required: false
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          description: 등록 시각 범위 끝 (UTC, 미포함)
          required: false
          schema:
            type: string
            format: date-time
        - name: sortBy
          in: query
          description: 정렬 기준 (createdAt 등록일, endDate 만료일, totalCount 총 횟수, remainingCount 잔여 횟수)
          required: false
          schema:
            type: string
            enum: [createdAt, endDate, totalCount, remainingCount]
            default: createdAt
        - name: order
          in: query
          description: 정렬 방향 (ASC 오름차순, DESC 내림차순)
          required: false
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Pass]
      operationId: createPass
      summary: 이용권 발급 (관리자)
      description: |
        관리자 전용. 이용권 상품을 기준으로 회원에게 이용권을 발급한다.
        - 총 횟수는 발급 시점의 상품 값이 복사된다. 이용권 금액(`price`)은 요청에서 지정하지 않으면 상품 가격이고, 지정하면(예 할인) 그 값이 쓰인다.
        - 발급 직후에는 결제 기록이 없는 미결제(`UNPAID`) 상태이다. 결제는 `recordPassPayment`로 기록한다. 금액이 0이면 바로 `PAID`이다.
        - 만료일은 `시작일 + 상품의 유효 기간 - 1일`이다 (만료일 당일 끝까지 사용 가능).
        - 시작일이 오늘보다 미래이면 `UPCOMING`, 아니면 `ACTIVE`로 발급된다. 시작일은 과거로도 지정할 수 있으나, 만료일이 이미 지났으면 400 (INVALID_START_DATE).
        - 회원이 활성 상태의 일반 회원(`MEMBER`)이 아니면 400 (INVALID_MEMBER)
        - 담당 강사가 활성 상태의 강사(`INSTRUCTOR`)가 아니면 400 (INVALID_INSTRUCTOR)
        - 퇴사일이 등록된 강사는 담당 강사로 지정할 수 없다 (409, INSTRUCTOR_RESIGNING)
        - 상품 또는 회원, 강사가 없으면 404
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassCreateRequest'
      responses:
        '201':
          description: 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /passes/{passId}:
    parameters:
      - $ref: '#/components/parameters/PassIdPath'
    get:
      tags: [Pass]
      operationId: getPass
      summary: 이용권 상세 조회 (관리자)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Pass]
      operationId: updatePass
      summary: 이용권 수정 (관리자)
      description: |
        관리자 전용. 해당 회원의 이용권 한 건만 수정한다 (상품과 다른 회원의 이용권에는 영향이 없다). 전달한 필드만 수정하며 최소 1개 필드가 필요하다.
        - 잔여 횟수는 0 이상, 총 횟수 이하여야 한다 (400, INVALID_REMAINING_COUNT).
        - 만료일은 시작일 이후여야 한다 (400, INVALID_END_DATE).
        - 만료일을 바꾸면 상태가 다시 계산된다. 미래 날짜로 수정하면 만료된 이용권도 `ACTIVE`로 돌아온다.
        - 일시정지로 연장된 일수는 이미 만료일에 반영되어 있다. 만료일을 직접 수정하면 그 값이 그대로 적용된다.
        - 담당 강사가 활성 상태의 강사(`INSTRUCTOR`)가 아니면 400 (INVALID_INSTRUCTOR)
        - 담당 강사를 바꿀 때 퇴사일이 등록된 강사로는 지정할 수 없다 (409, INSTRUCTOR_RESIGNING)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassUpdateRequest'
      responses:
        '200':
          description: 수정 성공 (수정된 이용권)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 이용권 결제 기록 =====
  /passes/{passId}/payments:
    parameters:
      - $ref: '#/components/parameters/PassIdPath'
    get:
      tags: [Payment]
      operationId: getPassPayments
      summary: 이용권 결제 기록 조회 (관리자)
      description: 관리자 전용. 결제일 내림차순(같으면 기록 최신순)으로 정렬된다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassPaymentPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Payment]
      operationId: recordPassPayment
      summary: 이용권 결제 기록 (관리자)
      description: |
        관리자 전용. 센터에서 오프라인으로(카드, 현금 등) 받은 결제를 기록한다. 시스템이 실제 결제를 처리하지는 않는다.
        - 여러 번 나누어 기록할 수 있다. 기록된 결제 합계가 이용권 금액(`price`)을 넘으면 409 (PAYMENT_EXCEEDS_PRICE).
        - 만료된 이용권에도 기록할 수 있다.
        - 결제일이 오늘(센터 현지 날짜)보다 미래이면 400 (INVALID_PAYMENT_DATE)
        - 기록하면 이용권의 `paidAmount`, `unpaidAmount`, `paymentStatus`가 갱신된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassPaymentCreateRequest'
      responses:
        '201':
          description: 기록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassPayment'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /passes/{passId}/payments/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/PassIdPath'
      - $ref: '#/components/parameters/PaymentIdPath'
    patch:
      tags: [Payment]
      operationId: updatePassPayment
      summary: 이용권 결제 기록 정정 (관리자)
      description: |
        관리자 전용. 잘못 입력한 결제 기록의 금액, 수단, 결제일, 메모를 고친다. 전달한 필드만 수정하며 최소 1개 필드가 필요하다.
        정정 전후 값은 활동 이력에 남는다.
        - 금액을 고친 뒤의 결제 합계가 이용권 금액(`price`)을 넘으면 409 (PAYMENT_EXCEEDS_PRICE)
        - 결제일이 오늘(센터 현지 날짜)보다 미래이면 400 (INVALID_PAYMENT_DATE)
        - 환불로 체크된 기록은 정정할 수 없다 (409, PAYMENT_REFUNDED). 먼저 환불 체크를 해제해야 한다.
        - 이용권의 `paidAmount`, `unpaidAmount`, `paymentStatus`가 다시 계산된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassPaymentUpdateRequest'
      responses:
        '200':
          description: 정정 성공 (정정된 결제 기록)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassPayment'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Payment]
      operationId: deletePassPayment
      summary: 이용권 결제 기록 삭제 (관리자)
      description: |
        관리자 전용. 잘못 입력한 결제 기록을 삭제한다. 삭제하면 미수금이 다시 늘어난다.
        삭제한 사실은 활동 이력에 남는다. 환불은 삭제가 아니라 `setPassPaymentRefund`로 체크한다.
        - 환불로 체크된 기록은 삭제할 수 없다 (409, PAYMENT_REFUNDED). 먼저 환불 체크를 해제해야 한다.
      responses:
        '204':
          description: 삭제 성공
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /passes/{passId}/payments/{paymentId}/refund:
    parameters:
      - $ref: '#/components/parameters/PassIdPath'
      - $ref: '#/components/parameters/PaymentIdPath'
    put:
      tags: [Payment]
      operationId: setPassPaymentRefund
      summary: 결제 기록 환불 여부 체크 (관리자)
      description: |
        관리자 전용. 결제 기록에 환불 여부를 체크하거나 해제한다. 실제 환불은 시스템 밖에서 이뤄지며, 환불했다는 사실만 기록한다.
        - 이용권, 예약, 미수금은 자동으로 바뀌지 않는다. 환불로 체크된 기록도 이용권의 결제 합계(`paidAmount`)에 그대로 포함된다. 이용권을 회수하려면 `updatePass`로 잔여 횟수나 만료일을 직접 조정한다.
        - `refunded`가 true이면 환불일(`refundedAt`)을 기록한다. 생략하면 오늘(센터 현지 날짜)이다. 환불일이 미래이거나 결제일보다 빠르면 400 (INVALID_PAYMENT_DATE).
        - `refunded`가 false이면 환불 체크를 해제하고, 환불일과 메모는 지워진다.
        - 같은 값으로 다시 요청해도 오류 없이 처리된다.
        - 체크와 해제는 활동 이력에 남는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassPaymentRefundRequest'
      responses:
        '200':
          description: 처리 성공 (변경된 결제 기록)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassPayment'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payments:
    get:
      tags: [Payment]
      operationId: getPayments
      summary: 전체 결제 기록 조회 (관리자)
      description: |
        관리자 전용. 모든 이용권의 결제 기록을 가로질러 조회한다. 정렬 기준은 `sortBy`, 방향은 `order`로 지정한다 (기본은 결제일 내림차순, 같으면 기록 최신순).
        - 월, 일, 년 단위 조회는 결제일 범위(`paidFrom`~`paidTo`)로 표현한다. 두 값 모두 센터 현지 날짜이며 시작일과 종료일을 포함한다.
        - `keyword`는 회원 이름에 부분 일치한다.
        - 환불로 체크된 기록도 기본으로 포함된다. `refunded`로 걸러낼 수 있다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: paidFrom
          in: query
          description: 결제일 범위 시작 (센터 현지 날짜, 포함)
          required: false
          schema:
            type: string
            format: date
        - name: paidTo
          in: query
          description: 결제일 범위 끝 (센터 현지 날짜, 포함). 시작일보다 빠를 수 없다.
          required: false
          schema:
            type: string
            format: date
        - name: method
          in: query
          description: 결제 수단 필터
          required: false
          schema:
            $ref: '#/components/schemas/PaymentMethod'
        - name: memberId
          in: query
          description: 회원 필터
          required: false
          schema:
            type: integer
            format: int64
        - name: keyword
          in: query
          description: 회원 이름 검색어
          required: false
          schema:
            type: string
            maxLength: 50
        - name: refunded
          in: query
          description: 환불 체크 여부 필터 (true이면 환불로 체크된 기록만, false이면 환불되지 않은 기록만)
          required: false
          schema:
            type: boolean
        - name: sortBy
          in: query
          description: 정렬 기준 (paidAt 결제일, amount 결제 금액)
          required: false
          schema:
            type: string
            enum: [paidAt, amount]
            default: paidAt
        - name: order
          in: query
          description: 정렬 방향 (ASC 오름차순, DESC 내림차순)
          required: false
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassPaymentPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 이용권 일시정지 =====
  /passes/{passId}/pauses:
    parameters:
      - $ref: '#/components/parameters/PassIdPath'
    get:
      tags: [Pass]
      operationId: getPassPauses
      summary: 이용권 일시정지 이력 조회 (관리자)
      description: 관리자 전용. 정지 시작일 내림차순으로 정렬된다. 취소된 정지도 포함된다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassPausePageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Pass]
      operationId: createPassPause
      summary: 이용권 일시정지 등록 (관리자)
      description: |
        관리자 전용. 기간(시작일~종료일, 둘 다 포함)을 정해 이용권을 일시정지한다. 정지 기간이나 횟수에는 제한이 없다.
        - 시작일은 오늘이거나 미래일 수 있다. 시작일이 미래이면 정지는 `SCHEDULED`로 등록되고, 그날이 되면 서버가 자동으로 `ACTIVE`로 전환한다.
        - 정지 기간에는 이용권 상태가 `PAUSED`이고, 정지 기간에 속한 수업일에는 이 이용권으로 예약할 수 없다.
        - 정지 일수(`종료일 - 시작일 + 1`)만큼 이용권의 만료일이 즉시 연장된다. 조기 해제하거나 취소하면 사용하지 않은 일수만큼 다시 줄어든다.
        - 시작일이 오늘보다 과거이거나 종료일이 시작일보다 빠르거나, 시작일이 이용권의 시작일~만료일 밖이면 400 (INVALID_PAUSE_PERIOD)
        - 이미 만료된 이용권이면 409 (PASS_EXPIRED)
        - 취소되지 않은 다른 정지 기간과 겹치면 409 (PAUSE_PERIOD_OVERLAP)
        - 이 이용권으로 한 예약(`RESERVED`) 중 수업일이 정지 기간에 속하는 것이 있으면 409 (PAUSE_HAS_RESERVATIONS). 해당 예약을 먼저 취소해야 한다.
        - 정지 등록 후에는 이용권의 만료일이 바뀌므로 클라이언트는 이용권을 다시 조회한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassPauseCreateRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassPause'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /passes/{passId}/pauses/{pauseId}/terminations:
    parameters:
      - $ref: '#/components/parameters/PassIdPath'
      - $ref: '#/components/parameters/PauseIdPath'
    post:
      tags: [Pass]
      operationId: terminatePassPause
      summary: 이용권 일시정지 해제 (관리자)
      description: |
        관리자 전용. 정지를 조기에 끝낸다.
        - 아직 시작하지 않은(`SCHEDULED`) 정지는 취소(`CANCELED`)되며, 연장했던 만료일이 모두 원래대로 돌아간다.
        - 진행 중인(`ACTIVE`) 정지는 오늘부터 해제된다. 정지 종료일이 어제로 바뀌고(`ENDED`), 사용하지 않은 일수만큼 만료일이 줄어든다. 시작일 당일에 해제하면 사용한 일수가 0이므로 취소와 같이 처리된다.
        - 이미 끝났거나(`ENDED`) 취소된(`CANCELED`) 정지이면 409 (INVALID_PAUSE_STATUS)
        - 해제 후에는 이용권의 만료일과 상태가 바뀌므로 클라이언트는 이용권을 다시 조회한다.
      responses:
        '200':
          description: 해제 성공 (변경된 정지)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassPause'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/me/passes:
    get:
      tags: [Pass]
      operationId: getMyPasses
      summary: 내 이용권 목록 조회
      description: |
        로그인한 회원 본인의 이용권만 조회한다. 만료일 오름차순으로 정렬된다 (예약 시 자동으로 선택되는 순서와 같다).
        일반 회원이 아닌 계정은 빈 목록이 반환된다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: status
          in: query
          description: 상태 필터
          required: false
          schema:
            $ref: '#/components/schemas/PassStatus'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 예약 / 출결 =====
  /reservations:
    get:
      tags: [Reservation]
      operationId: getReservations
      summary: 예약 목록 조회 (관리자 또는 MEMBER_READ)
      description: |
        관리자 또는 `MEMBER_READ` 권한을 가진 강사만 가능하다 (없으면 403, PERMISSION_DENIED). 회원별, 수업별 예약을 조회할 때 사용한다.
        수업 시작 시각 기준으로 정렬하며 방향은 `order`로 지정한다 (기본 DESC).
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: memberId
          in: query
          description: 회원 필터
          required: false
          schema:
            type: integer
            format: int64
        - name: lessonId
          in: query
          description: 수업 필터
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: 예약 상태 필터
          required: false
          schema:
            $ref: '#/components/schemas/ReservationStatus'
        - name: lessonFrom
          in: query
          description: 수업 시작 시각 범위 시작 (UTC, 포함)
          required: false
          schema:
            type: string
            format: date-time
        - name: lessonTo
          in: query
          description: 수업 시작 시각 범위 끝 (UTC, 미포함)
          required: false
          schema:
            type: string
            format: date-time
        - name: order
          in: query
          description: 수업 시작 시각 정렬 방향 (ASC 오름차순, DESC 내림차순)
          required: false
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Reservation]
      operationId: createReservation
      summary: 수업 예약 (회원)
      description: |
        일반 회원(`MEMBER`)만 가능하며 본인 명의로만 예약한다 (그 외 역할은 403). 예약 즉시 확정되고, 이용권의 잔여 횟수가 1회 차감된다.
        사용할 이용권은 서버가 자동으로 선택한다.
        - 수업일(센터 현지 날짜)이 시작일~만료일 안에 있고, 일시정지 기간에 속하지 않으며, 잔여 횟수가 1회 이상인 이용권 중, 만료일이 가장 이른 것 (같으면 먼저 발급된 것)을 사용한다.
        - 예약 정책에서 미수 예약을 허용하지 않으면(`allowUnpaidReservation`이 false) 완납(`PAID`)한 이용권만 대상이다.
        - 공개된(`PUBLISHED`) 수업만 예약할 수 있다. 존재하지 않거나 볼 수 없는 수업은 404.
        - 비공개, 취소, 이미 시작한 수업이면 409 (LESSON_NOT_RESERVABLE)
        - 정원이 찼으면 409 (LESSON_FULL). 대기 예약은 없다.
        - 이미 같은 수업을 예약 중(`RESERVED`)이면 409 (ALREADY_RESERVED). 취소한 수업은 다시 예약할 수 있다.
        - 사용할 수 있는 이용권이 없으면 409 (NO_AVAILABLE_PASS). 미수 예약이 허용되지 않아서 완납하지 않은 이용권만 있는 경우에는 409 (PASS_UNPAID)이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
      responses:
        '201':
          description: 예약 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reservations/{reservationId}:
    parameters:
      - $ref: '#/components/parameters/ReservationIdPath'
    get:
      tags: [Reservation]
      operationId: getReservation
      summary: 예약 상세 조회
      description: |
        예약한 본인, 관리자, 해당 수업의 담당 강사, `MEMBER_READ` 권한을 가진 강사만 볼 수 있다.
        볼 수 없는 예약은 존재 여부를 숨기기 위해 404를 반환한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reservations/{reservationId}/cancellations:
    parameters:
      - $ref: '#/components/parameters/ReservationIdPath'
    post:
      tags: [Reservation]
      operationId: cancelReservation
      summary: 예약 취소
      description: |
        예약한 회원 본인 또는 관리자만 가능하다. 취소하면 사용했던 이용권의 잔여 횟수가 1회 복구된다 (만료된 이용권도 횟수만 증가).
        - 회원 본인은 수업 시작 `cancelDeadlineHours`시간 전까지만 취소할 수 있다. 지나면 409 (CANCELLATION_DEADLINE_PASSED).
        - 관리자는 취소 시간 정책과 무관하게 취소할 수 있다. 관리자가 취소하면 회원에게 인앱 알림이 발송된다.
        - 이미 시작한 수업의 예약은 누구도 취소할 수 없다 (409, LESSON_ALREADY_STARTED). 출결로 처리한다.
        - `RESERVED`가 아닌 예약은 409 (INVALID_RESERVATION_STATUS)
        - 본인 예약이 아니면 403, 볼 수 없는 예약이면 404
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCancelRequest'
      responses:
        '200':
          description: 취소 성공 (취소된 예약)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reservations/{reservationId}/attendance:
    parameters:
      - $ref: '#/components/parameters/ReservationIdPath'
    put:
      tags: [Reservation]
      operationId: confirmAttendance
      summary: 출결 기록 (관리자 또는 담당 강사)
      description: |
        관리자 또는 해당 수업의 담당 강사만 가능하다 (아니면 403). 출석(`ATTENDED`) 또는 노쇼(`NO_SHOW`)를 기록하며, 이미 기록된 출결도 같은 API로 정정한다.
        - 이용권 횟수는 예약할 때 이미 차감되었으므로, 출석과 노쇼 모두 횟수에 영향이 없다. 노쇼도 차감이 유지되며 출석으로 기록되지 않는다.
        - 수업이 시작되기 전이면 409 (LESSON_NOT_STARTED). 정정은 기간 제한이 없다.
        - 이미 강사 정산에 포함된 수업은 출결을 정정할 수 없다 (409, LESSON_SETTLED). 정산을 폐기(`discardSettlement`)하면 다시 정정할 수 있다.
        - 취소된(`CANCELED`) 예약은 409 (INVALID_RESERVATION_STATUS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
      responses:
        '200':
          description: 기록 성공 (갱신된 예약)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /lessons/{lessonId}/reservations:
    parameters:
      - $ref: '#/components/parameters/LessonIdPath'
    get:
      tags: [Reservation]
      operationId: getLessonReservations
      summary: 수업 예약자 목록 조회 (관리자 또는 담당 강사)
      description: |
        관리자 또는 해당 수업의 담당 강사만 가능하다 (아니면 403). 예약한 시각 오름차순으로 정렬된다. 출결 화면에서 사용한다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: status
          in: query
          description: 예약 상태 필터
          required: false
          schema:
            $ref: '#/components/schemas/ReservationStatus'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/me/reservations:
    get:
      tags: [Reservation]
      operationId: getMyReservations
      summary: 내 예약 목록 조회
      description: |
        로그인한 회원 본인의 예약만 조회한다. 취소된 수업의 예약도 포함된다. 수업 시작 시각 기준으로 정렬하며 방향은 `order`로 지정한다 (기본 DESC).
        일반 회원이 아닌 계정은 빈 목록이 반환된다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: status
          in: query
          description: 예약 상태 필터
          required: false
          schema:
            $ref: '#/components/schemas/ReservationStatus'
        - name: lessonFrom
          in: query
          description: 수업 시작 시각 범위 시작 (UTC, 포함)
          required: false
          schema:
            type: string
            format: date-time
        - name: lessonTo
          in: query
          description: 수업 시작 시각 범위 끝 (UTC, 미포함)
          required: false
          schema:
            type: string
            format: date-time
        - name: order
          in: query
          description: 수업 시작 시각 정렬 방향 (ASC 오름차순, DESC 내림차순)
          required: false
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 예약 정책 =====
  /reservation-policy:
    get:
      tags: [ReservationPolicy]
      operationId: getReservationPolicy
      summary: 예약 정책 조회
      description: 로그인한 모든 사용자가 조회할 수 있다 (회원 화면에 취소 마감 시간과 미수 예약 가능 여부를 안내하기 위해).
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPolicy'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [ReservationPolicy]
      operationId: updateReservationPolicy
      summary: 예약 정책 설정 (관리자)
      description: |
        관리자 전용. 정책 값을 교체한다. 이미 예약된 건에도 변경된 값이 적용되며, 이후 취소 요청부터 새 마감 시간으로 판단한다.
        미수 예약 허용 여부는 이후 예약부터 적용되고, 이미 한 예약에는 영향이 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationPolicy'
      responses:
        '200':
          description: 설정 성공 (저장된 정책)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPolicy'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 활동 이력 =====
  /activity-logs:
    get:
      tags: [ActivityLog]
      operationId: getActivityLogs
      summary: 활동 이력 조회 (관리자)
      description: |
        관리자 전용. 발생 시각 기준으로 정렬하며 방향은 `order`로 지정한다 (기본 DESC, 최신순).
        카테고리, 행위 코드, 행위자, 대상, 기간 등 필터를 함께 사용할 수 있다.
        - 사용 가능한 카테고리와 행위 코드는 `GET /activity-log-actions`로 조회한다.
        - 특정 이용권의 이력은 `targetType=PASS&targetId={passId}`로, 특정 수업의 이력은 `targetType=LESSON&targetId={lessonId}`로 조회한다.
        - `actorId`는 행동을 한 사람, `subjectMemberId`는 그 행동의 영향을 받은 회원이다. 예를 들어 강사 A가 수업을 변경했다면 `actorId`가 A이다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: category
          in: query
          description: 카테고리 필터 (예 LESSON, RESERVATION)
          required: false
          schema:
            type: string
        - name: action
          in: query
          description: 행위 코드 필터 (예 LESSON_CANCELED)
          required: false
          schema:
            type: string
        - name: actorId
          in: query
          description: 행위자 회원 ID 필터
          required: false
          schema:
            type: integer
            format: int64
        - name: actorRole
          in: query
          description: 행위자 역할 필터
          required: false
          schema:
            $ref: '#/components/schemas/MemberRole'
        - name: subjectMemberId
          in: query
          description: 영향받은 회원 ID 필터
          required: false
          schema:
            type: integer
            format: int64
        - name: targetType
          in: query
          description: 대상 종류 필터 (예 LESSON, PASS)
          required: false
          schema:
            type: string
        - name: targetId
          in: query
          description: 대상 ID 필터. targetType과 함께 사용한다.
          required: false
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          description: 발생 시각 범위 시작 (UTC, 포함)
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 발생 시각 범위 끝 (UTC, 미포함)
          required: false
          schema:
            type: string
            format: date-time
        - name: order
          in: query
          description: 발생 시각 정렬 방향 (ASC 오름차순, DESC 내림차순)
          required: false
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /activity-log-actions:
    get:
      tags: [ActivityLog]
      operationId: getActivityLogActions
      summary: 활동 이력 카테고리와 행위 코드 목록 조회 (관리자)
      description: |
        관리자 전용. 이력 조회 화면의 필터를 그리기 위한 카테고리별 행위 코드 목록을 반환한다. 카테고리는 이력을 묶어 보는 태그 역할을 한다.
        새로운 기능이 추가되면 카테고리나 행위 코드가 늘어날 수 있으므로, 클라이언트는 이 목록을 기준으로 필터를 구성하고 알 수 없는 값도 그대로 표시할 수 있어야 한다.
        페이징을 사용하지 않는다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogActionCatalogResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 알림 =====
  /notifications:
    get:
      tags: [Notification]
      operationId: getMyNotifications
      summary: 내 알림 목록 조회
      description: 로그인한 사용자 본인의 알림만 조회한다. 최신순으로 정렬된다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: unread
          in: query
          description: true이면 읽지 않은 알림만 조회한다
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/unread-count:
    get:
      tags: [Notification]
      operationId: getMyUnreadNotificationCount
      summary: 내 읽지 않은 알림 수 조회
      description: 화면 상단의 알림 뱃지용이다. 실시간 전송이 없으므로 클라이언트가 주기적으로 조회한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadNotificationCountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/read:
    put:
      tags: [Notification]
      operationId: readAllNotifications
      summary: 내 알림 전체 읽음 처리
      description: 본인의 읽지 않은 알림을 모두 읽음 처리한다. 이미 모두 읽은 상태여도 204를 반환한다.
      responses:
        '204':
          description: 처리 성공
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationIdPath'
    put:
      tags: [Notification]
      operationId: readNotification
      summary: 알림 읽음 처리
      description: |
        본인의 알림만 처리할 수 있다. 이미 읽은 알림이어도 204를 반환한다.
        다른 사용자의 알림이거나 없는 알림이면 404.
      responses:
        '204':
          description: 처리 성공
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 강사 수당 단가 =====
  /members/{memberId}/pay-rates:
    parameters:
      - $ref: '#/components/parameters/MemberIdPath'
    get:
      tags: [PayRate]
      operationId: getPayRates
      summary: 강사의 수당 단가 조회 (관리자)
      description: |
        관리자 전용. 단가가 설정된 수업 유형만 반환한다.
        대상이 강사(`INSTRUCTOR`)가 아니면 404이다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayRatesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [PayRate]
      operationId: updatePayRates
      summary: 강사의 수당 단가 설정 (관리자)
      description: |
        관리자 전용. 강사의 수업 유형별 수업당 단가 목록을 전달한 목록으로 통째로 교체한다. 목록에 없는 수업 유형의 단가는 삭제된다.
        단가는 수업에 출석한 인원 수와 무관하게 수업 유형으로만 정해진다.
        - 변경된 단가는 이후에 계산하는 정산부터 적용된다. 이미 계산된 정산은 계산 시점의 단가를 유지한다.
        - 대상이 강사(`INSTRUCTOR`)가 아니면 400 (INVALID_INSTRUCTOR). 퇴사한 강사의 단가도 설정할 수 있다.
        - 수업 유형이 중복되거나 존재하지 않으면 400 (INVALID_PAY_RATE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRatesRequest'
      responses:
        '200':
          description: 설정 성공 (저장된 단가)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayRatesResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 강사 정산 =====
  /settlements:
    get:
      tags: [Settlement]
      operationId: getSettlements
      summary: 정산 목록 조회 (관리자)
      description: 관리자 전용. 생성 최신순으로 정렬된다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: instructorId
          in: query
          description: 강사 필터
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: 정산 상태 필터
          required: false
          schema:
            $ref: '#/components/schemas/SettlementStatus'
        - name: periodFrom
          in: query
          description: 이 날짜 이후에 끝나는 기간의 정산만 조회 (센터 현지 날짜, 포함)
          required: false
          schema:
            type: string
            format: date
        - name: periodTo
          in: query
          description: 이 날짜 이전에 시작하는 기간의 정산만 조회 (센터 현지 날짜, 포함)
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Settlement]
      operationId: createSettlement
      summary: 정산 계산 (관리자)
      description: |
        관리자 전용. 강사 한 명의 지정한 기간(정산 기간)에 대한 수당을 계산하고 `CALCULATED` 상태의 정산을 만든다.
        계산과 동시에 기간 안의 수업 실적이 확정(정산에 편입)되며, 이때의 수업 유형별 단가가 기록된다.
        - 기간은 센터 현지 날짜이며 시작일과 종료일을 모두 포함한다. 종료일은 오늘보다 과거여야 한다 (400, INVALID_PERIOD).
        - 수업 시작일이 기간 안에 있는 담당 수업 중, 취소되지 않았고 이미 끝난 수업이 대상이다.
        - 수업당 금액은 담당 강사와 수업 유형으로 정해진 단가이며 출석 인원 수와 무관하다.
        - 정산 여부는 예약을 기준으로 정한다. 취소되지 않은 예약(`RESERVED`, `ATTENDED`, `NO_SHOW`)이 한 건이라도 있으면 수업이 진행된 것으로 보아 정산하며, 전원 노쇼여도 정산 대상이다.
        - 취소되지 않은 예약이 한 건도 없는 수업은 진행되지 않은 것으로 보아 미정산 처리된다 (`excludedReason`은 NO_RESERVATION). 금액은 0이며 정산 내역에는 사유와 함께 남는다.
        - 기간 안에 출결이 기록되지 않은(`RESERVED`) 예약이 있는 수업이 있으면 409 (UNRECORDED_ATTENDANCE_EXISTS). 해당 수업 ID 목록이 `invalidParams`에 담긴다.
        - 정산 대상 수업 중 단가가 설정되지 않은 수업 유형이 있으면 409 (PAY_RATE_NOT_SET). 해당 수업 유형이 `invalidParams`에 담긴다.
        - 같은 강사의 폐기되지 않은 정산과 기간이 겹치면 409 (SETTLEMENT_PERIOD_OVERLAP). 한 수업은 하나의 정산에만 포함된다.
        - 대상이 강사(`INSTRUCTOR`)가 아니면 400 (INVALID_INSTRUCTOR). 퇴사한 강사도 정산할 수 있다 (퇴사 후 정산은 관리자가 직접 처리한다).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementCreateRequest'
      responses:
        '201':
          description: 계산 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementDetail'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /settlements/{settlementId}:
    parameters:
      - $ref: '#/components/parameters/SettlementIdPath'
    get:
      tags: [Settlement]
      operationId: getSettlement
      summary: 정산 상세 조회 (관리자)
      description: 관리자 전용. 수업별 내역(`items`)을 포함한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Settlement]
      operationId: discardSettlement
      summary: 정산 폐기 (관리자)
      description: |
        관리자 전용. 정산을 폐기하면 포함됐던 수업이 정산에서 풀려 다시 출결을 정정하고 새로 계산할 수 있다.
        - `CALCULATED`, `REVIEW_REQUESTED` 상태에서만 가능하다. 확정(`CONFIRMED`) 이후는 409 (INVALID_SETTLEMENT_STATUS).
        - 폐기 이력은 활동 이력에 남는다.
      responses:
        '204':
          description: 폐기 성공
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /settlements/{settlementId}/review-requests:
    parameters:
      - $ref: '#/components/parameters/SettlementIdPath'
    post:
      tags: [Settlement]
      operationId: requestSettlementReview
      summary: 정산 검토 요청 (관리자)
      description: |
        관리자 전용. `CALCULATED`에서 `REVIEW_REQUESTED`로 바뀐다.
        - `CALCULATED`가 아니면 409 (INVALID_SETTLEMENT_STATUS)
      responses:
        '200':
          description: 요청 성공 (변경된 정산)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /settlements/{settlementId}/confirmations:
    parameters:
      - $ref: '#/components/parameters/SettlementIdPath'
    post:
      tags: [Settlement]
      operationId: confirmSettlement
      summary: 정산 확정 (관리자)
      description: |
        관리자 전용. `REVIEW_REQUESTED`에서 `CONFIRMED`로 바뀌며, 확정되면 금액을 더 이상 바꿀 수 없다.
        - `REVIEW_REQUESTED`가 아니면 409 (INVALID_SETTLEMENT_STATUS)
      responses:
        '200':
          description: 확정 성공 (변경된 정산)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /settlements/{settlementId}/payments:
    parameters:
      - $ref: '#/components/parameters/SettlementIdPath'
    post:
      tags: [Settlement]
      operationId: recordSettlementPayment
      summary: 외부 지급 기록 (관리자)
      description: |
        관리자 전용. 실제 지급은 시스템 밖에서 이뤄지며, 지급했다는 사실만 기록한다. 지급 금액은 정산의 확정 금액과 같고 분할 지급은 지원하지 않는다.
        - `CONFIRMED`에서 `PAID`로 바뀐다. `CONFIRMED`가 아니면 409 (INVALID_SETTLEMENT_STATUS).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementPaymentRequest'
      responses:
        '200':
          description: 기록 성공 (변경된 정산)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 강사: 수업 가능시간 / 퇴사 / 수업 인계 =====
  /members/{memberId}/availability:
    parameters:
      - $ref: '#/components/parameters/MemberIdPath'
    get:
      tags: [Instructor]
      operationId: getInstructorAvailability
      summary: 강사의 수업 가능시간 조회 (관리자 또는 본인)
      description: |
        관리자 또는 해당 강사 본인만 가능하다. 대상이 강사(`INSTRUCTOR`)가 아니거나 다른 강사의 가능시간이면 404이다.
        요일별로 시간대가 여러 개일 수 있다. 가능시간이 설정되지 않았으면 빈 목록이며, 그 강사에게는 수업을 배정할 수 없다.
        가능시간을 별도 목록이 아닌 요일별 시간대 모음으로 반환하므로 페이징을 사용하지 않는다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [Instructor]
      operationId: updateInstructorAvailability
      summary: 강사의 수업 가능시간 설정 (관리자)
      description: |
        관리자 전용. 요일별 가능 시간대 목록을 전달한 목록으로 통째로 교체한다. 목록에 없는 요일은 수업을 할 수 없는 날이다.
        시간은 센터 현지 시각(Asia/Seoul) `HH:mm`이며, 이 API만 UTC가 아닌 현지 시각을 사용한다.
        - 수업 개설과 수정 때 수업 시간이 강사의 가능 시간대 하나 안에 모두 들어와야 한다 (강제). 아니면 수업 개설과 수정이 거부된다.
        - 이미 개설된 수업에는 영향을 주지 않는다. 이후 개설과 수정 때만 검증한다.
        - 시작 시각이 종료 시각보다 늦거나 같은 시간대, 같은 요일 안에서 겹치는 시간대가 있으면 400 (INVALID_AVAILABILITY)
        - 대상이 강사(`INSTRUCTOR`)가 아니면 404
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'
      responses:
        '200':
          description: 설정 성공 (저장된 가능시간)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/{memberId}/resignation:
    parameters:
      - $ref: '#/components/parameters/MemberIdPath'
    put:
      tags: [Instructor]
      operationId: registerResignation
      summary: 강사 퇴사일 등록 (관리자)
      description: |
        관리자 전용. 퇴사일을 등록하거나 이미 등록된 퇴사일을 바꾼다. 퇴사일은 퇴사 효력이 생기는 날이며, 아직 퇴사 처리가 된 것은 아니다 (`completeResignation`으로 처리한다).
        - 퇴사일 이후(수업일이 퇴사일과 같거나 이후)에는 그 강사에게 새 수업과 새 이용권 담당을 배정할 수 없다 (수업 개설, 수정, 이용권 발급이 거부된다).
        - 퇴사일 이후에 시작하는 기존 수업은 `reassignLessons`로 다른 강사에게 인계한다.
        - 퇴사일이 오늘(센터 현지 날짜)보다 과거이면 400 (INVALID_RESIGNATION_DATE)
        - 대상이 활성 상태의 강사(`INSTRUCTOR`)가 아니면 400 (INVALID_INSTRUCTOR). 이미 퇴사한 강사이면 409 (MEMBER_RESIGNED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResignationRequest'
      responses:
        '200':
          description: 등록 성공 (퇴사일이 반영된 회원)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Instructor]
      operationId: cancelResignation
      summary: 강사 퇴사일 등록 취소 (관리자)
      description: |
        관리자 전용. 등록된 퇴사일을 없애고 새 배정 차단을 푼다. 퇴사 처리가 끝난 강사(`RESIGNED`)에는 사용할 수 없다.
        - 등록된 퇴사일이 없으면 409 (RESIGNATION_NOT_REGISTERED)
        - 이미 퇴사한 강사이면 409 (MEMBER_RESIGNED)
      responses:
        '204':
          description: 취소 성공
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/{memberId}/resignation/completions:
    parameters:
      - $ref: '#/components/parameters/MemberIdPath'
    post:
      tags: [Instructor]
      operationId: completeResignation
      summary: 강사 퇴사 처리 (관리자)
      description: |
        관리자 전용. 퇴사일이 등록된 강사를 퇴사 처리한다. 상태가 `RESIGNED`가 된다.
        - 처리하면 로그인할 수 없고, Refresh Token이 모두 폐기되며, 부여된 권한이 모두 회수된다. 승인 대기 중이거나 앞으로 시작하는 부재는 취소된다.
        - 담당 이용권은 그대로 남는다 (필요하면 `updatePass`로 담당 강사를 바꾼다).
        - 퇴사한 강사의 수당 단가와 정산은 계속 처리할 수 있다.
        - 등록된 퇴사일이 없으면 409 (RESIGNATION_NOT_REGISTERED)
        - 퇴사일이 아직 오지 않았으면 409 (RESIGNATION_DATE_NOT_REACHED)
        - 시작 전이고 취소되지 않은 담당 수업이 남아 있으면 409 (INSTRUCTOR_HAS_UPCOMING_LESSONS). `reassignLessons`로 먼저 인계해야 한다.
        - 이미 퇴사한 강사이면 409 (MEMBER_RESIGNED)
      responses:
        '200':
          description: 처리 성공 (퇴사 처리된 회원)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/{memberId}/lesson-reassignments:
    parameters:
      - $ref: '#/components/parameters/MemberIdPath'
    post:
      tags: [Instructor]
      operationId: reassignLessons
      summary: 강사의 미래 수업 인계 (관리자)
      description: |
        관리자 전용. 대상 강사가 담당하는 수업 중 `from` 이후에 시작하고 취소되지 않은 수업을 모두 다른 강사에게 넘긴다. 퇴사 전에 수업을 인계할 때 쓴다.
        - 모두 성공하거나 모두 실패한다. 넘기려는 수업 중 하나라도 새 강사에게 배정할 수 없으면 아무것도 바뀌지 않고 409 (REASSIGNMENT_FAILED)이며, 실패한 수업 ID와 사유가 `invalidParams`에 담긴다.
        - 새 강사는 `updateLesson`으로 강사를 바꿀 때와 같은 검증(활성 상태, 수업 가능시간, 부재, 퇴사일, 시간 겹침)을 통과해야 한다.
        - `from`을 생략하면 현재 시각이다.
        - 예약이 있는 수업도 넘길 수 있다 (예약은 그대로 유지된다).
        - 새 강사가 활성 상태의 강사(`INSTRUCTOR`)가 아니거나 대상 강사와 같으면 400 (INVALID_INSTRUCTOR)
        - 대상 강사가 강사(`INSTRUCTOR`)가 아니거나 새 강사가 없으면 404
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonReassignmentRequest'
      responses:
        '200':
          description: 인계 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonReassignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 강사 부재 =====
  /absences:
    get:
      tags: [Absence]
      operationId: getAbsences
      summary: 부재 목록 조회
      description: |
        관리자는 모든 부재를, 강사는 본인의 부재만 조회한다 (강사가 다른 강사의 `instructorId`를 지정해도 본인 것만 반환된다). 시작 시각 내림차순으로 정렬된다.
        `from` 이상 `to` 미만과 기간이 겹치는 부재를 조회한다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: instructorId
          in: query
          description: 강사 필터 (관리자만 의미가 있다)
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: 부재 상태 필터
          required: false
          schema:
            $ref: '#/components/schemas/AbsenceStatus'
        - name: from
          in: query
          description: 이 시각 이후에 끝나는 부재만 조회 (UTC, 포함)
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 이 시각 이전에 시작하는 부재만 조회 (UTC, 미포함)
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsencePageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Absence]
      operationId: createAbsence
      summary: 부재 신청 (강사)
      description: |
        강사(`INSTRUCTOR`)만 본인 명의로 신청할 수 있다 (그 외 역할은 403, PERMISSION_DENIED). `REQUESTED` 상태로 등록되며 관리자에게 인앱 알림이 발송된다.
        - 시작 시각이 종료 시각보다 늦거나 같거나, 시작 시각이 과거이면 400 (INVALID_ABSENCE_PERIOD)
        - 같은 강사의 승인 대기(`REQUESTED`) 또는 승인된(`APPROVED`) 부재와 기간이 겹치면 409 (ABSENCE_PERIOD_OVERLAP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceCreateRequest'
      responses:
        '201':
          description: 신청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Absence'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /absences/{absenceId}:
    parameters:
      - $ref: '#/components/parameters/AbsenceIdPath'
    get:
      tags: [Absence]
      operationId: getAbsence
      summary: 부재 상세 조회
      description: 관리자 또는 신청한 강사 본인만 볼 수 있다. 다른 강사의 부재는 존재 여부를 숨기기 위해 404를 반환한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Absence'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /absences/{absenceId}/approvals:
    parameters:
      - $ref: '#/components/parameters/AbsenceIdPath'
    post:
      tags: [Absence]
      operationId: approveAbsence
      summary: 부재 승인 (관리자)
      description: |
        관리자 전용. `REQUESTED`에서 `APPROVED`로 바뀌며 신청한 강사에게 인앱 알림이 발송된다.
        - 부재 기간과 겹치는 그 강사의 수업(취소되지 않은 것)에 예약이 하나라도 있으면 승인할 수 없다 (409, ABSENCE_HAS_RESERVATIONS). 해당 수업 ID가 `invalidParams`에 담기며, 부재는 `REQUESTED`로 남는다. 관리자는 예약을 정리하거나 반려할 수 있다.
        - 예약이 없는 수업은 승인과 동시에 자동으로 취소된다 (예약이 없으면 진행되지 않는 수업이므로 영향이 없다).
        - 승인된 부재 기간에는 그 강사에게 수업을 배정할 수 없다 (수업 개설, 수정, 인계가 거부된다).
        - `REQUESTED`가 아니면 409 (INVALID_ABSENCE_STATUS)
      responses:
        '200':
          description: 승인 성공 (변경된 부재)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Absence'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /absences/{absenceId}/rejections:
    parameters:
      - $ref: '#/components/parameters/AbsenceIdPath'
    post:
      tags: [Absence]
      operationId: rejectAbsence
      summary: 부재 반려 (관리자)
      description: |
        관리자 전용. `REQUESTED`에서 `REJECTED`로 바뀌며 신청한 강사에게 인앱 알림이 발송된다.
        - `REQUESTED`가 아니면 409 (INVALID_ABSENCE_STATUS)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceRejectRequest'
      responses:
        '200':
          description: 반려 성공 (변경된 부재)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Absence'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /absences/{absenceId}/cancellations:
    parameters:
      - $ref: '#/components/parameters/AbsenceIdPath'
    post:
      tags: [Absence]
      operationId: cancelAbsence
      summary: 부재 취소
      description: |
        신청한 강사 본인 또는 관리자만 가능하다. `CANCELED`로 바뀌며 배정 금지도 풀린다.
        - 강사 본인은 승인 전(`REQUESTED`)에만 철회할 수 있다. 승인된(`APPROVED`) 부재를 강사가 취소하려 하면 403 (PERMISSION_DENIED).
        - 관리자는 `REQUESTED`와 `APPROVED` 모두 취소할 수 있다. 승인 때 자동으로 취소된 수업은 되살아나지 않는다.
        - 그 외 상태이면 409 (INVALID_ABSENCE_STATUS)
        - 다른 강사의 부재이면 404
      responses:
        '200':
          description: 취소 성공 (변경된 부재)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Absence'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 강사 목록 =====
  /instructors:
    get:
      tags: [Instructor]
      operationId: getInstructors
      summary: 강사 목록 조회
      description: |
        활동 중인(`ACTIVE`) 강사의 ID와 이름만 이름 오름차순으로 반환한다. 수업을 개설하거나 이용권을 발급할 때 담당 강사를 고르는 용도이다.
        `MEMBER_READ` 권한이 없는 강사도 담당 강사를 선택할 수 있도록, 로그인한 모든 사용자가 조회할 수 있다. 연락처 같은 개인정보는 포함하지 않는다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructorPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 룸 =====
  /rooms:
    get:
      tags: [Room]
      operationId: getRooms
      summary: 룸 목록 조회
      description: 이름 오름차순으로 정렬된다.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Room]
      operationId: createRoom
      summary: 룸 등록 (관리자)
      description: |
        관리자 전용.
        - 이미 같은 이름의 룸이 있으면 409 (ROOM_NAME_DUPLICATED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomIdPath'
    get:
      tags: [Room]
      operationId: getRoom
      summary: 룸 상세 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Room]
      operationId: updateRoom
      summary: 룸 수정 (관리자)
      description: |
        관리자 전용. 전달한 필드만 수정한다 (부분 수정). 최소 1개 필드가 필요하다.
        - 이미 같은 이름의 룸이 있으면 409 (ROOM_NAME_DUPLICATED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomUpdateRequest'
      responses:
        '200':
          description: 수정 성공 (수정된 룸)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Room]
      operationId: deleteRoom
      summary: 룸 삭제 (관리자)
      description: |
        관리자 전용.
        - 시작 전이고 취소되지 않은 수업이 있는 룸은 삭제할 수 없다 (409, ROOM_IN_USE). 취소된 수업은 포함하지 않는다.
      responses:
        '204':
          description: 삭제 성공
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== 영업시간 =====
  /business-hours:
    get:
      tags: [BusinessHour]
      operationId: getBusinessHours
      summary: 영업시간 조회
      description: |
        요일별 영업시간을 조회한다. 항상 7개 요일이 모두 반환되므로(고정 크기) 페이징을 사용하지 않는다.
        아직 설정한 적이 없으면 모든 요일이 휴무(`closed: true`)로 반환된다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessHoursResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [BusinessHour]
      operationId: updateBusinessHours
      summary: 영업시간 설정 (관리자)
      description: |
        관리자 전용. 7개 요일 전체를 한 번에 교체한다.
        - 요일이 누락되거나 중복되면 400 (INVALID_BUSINESS_HOURS)
        - `closed`가 false인 요일은 `openTime`이 `closeTime`보다 빨라야 한다 (400, INVALID_BUSINESS_HOURS)
        - 이미 개설된 수업에는 영향을 주지 않는다. 이후 수업 개설 시 검증에만 적용된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessHoursRequest'
      responses:
        '200':
          description: 설정 성공 (저장된 영업시간)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessHoursResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access Token을 'Bearer {token}' 형식으로 전달합니다. 로그인 응답 body로 발급되며, 만료되면 `POST /auth/refresh`로 재발급합니다.
        Refresh Token은 응답 body가 아니라 HttpOnly 쿠키(`refreshToken`)로만 주고받으며, 클라이언트 JS에서는 접근할 수 없습니다.

  headers:
    RefreshTokenSetCookie:
      description: |
        Refresh Token 쿠키.
        예: `refreshToken=...; HttpOnly; Secure; SameSite=Strict; Path=/v1/auth; Max-Age=1209600`
        브라우저는 /v1/auth 하위 요청에 쿠키를 자동 전송하므로 클라이언트는 `credentials: 'include'`로 요청해야 한다.
      schema:
        type: string

  parameters:
    PageQuery:
      name: page
      in: query
      description: 조회할 페이지 번호 (1부터 시작)
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    SizeQuery:
      name: size
      in: query
      description: 한 페이지에 표시할 항목 수
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    MemberIdPath:
      name: memberId
      in: path
      description: 회원 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1

    PaymentIdPath:
      name: paymentId
      in: path
      description: 결제 기록 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1

    PauseIdPath:
      name: pauseId
      in: path
      description: 일시정지 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1

    SettlementIdPath:
      name: settlementId
      in: path
      description: 정산 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1

    NotificationIdPath:
      name: notificationId
      in: path
      description: 알림 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1

    ReservationIdPath:
      name: reservationId
      in: path
      description: 예약 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1

    PassProductIdPath:
      name: passProductId
      in: path
      description: 이용권 상품 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1

    PassIdPath:
      name: passId
      in: path
      description: 이용권 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1

    AbsenceIdPath:
      name: absenceId
      in: path
      description: 부재 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1

    LessonIdPath:
      name: lessonId
      in: path
      description: 수업 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1

    LessonTypeIdPath:
      name: lessonTypeId
      in: path
      description: 수업 유형 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1

    RoomIdPath:
      name: roomId
      in: path
      description: 룸 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1

  schemas:
    # 1. 페이지네이션 메타데이터
    PageInfo:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 105
        totalPages:
          type: integer
          example: 6

    # 2. RFC 7807 기반 표준 에러 스키마 (Spring ProblemDetail 호환)
    ErrorResponse:
      type: object
      required: [type, title, status, detail, code, timestamp]
      properties:
        type:
          type: string
          description: 에러 유형 URI (별도 문서 없으면 about:blank)
          example: "about:blank"
        title:
          type: string
          example: "Invalid Request Parameter"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "요청 필드 형식이 올바르지 않습니다."
        instance:
          type: string
          description: 에러가 발생한 요청 경로
          example: "/v1/auth/sign-up"
        code:
          type: string
          description: 서비스 내부 에러 코드
          example: "INVALID_INPUT"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-05T04:10:00Z"
        invalidParams:
          type: array
          description: 유효성 검증 실패 상세 목록 (필요 시 포함)
          items:
            $ref: '#/components/schemas/InvalidParamDetail'

    InvalidParamDetail:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          example: "email"
        reason:
          type: string
          example: "올바른 이메일 형식이 아닙니다."
        value:
          type: string
          description: 거부된 값 (비밀번호 등 민감 필드는 생략)
          example: "user@invalid"

    # ===== 인증 =====
    EmailVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"

    EmailVerificationConfirmRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        code:
          type: string
          description: 이메일로 받은 인증 코드
          pattern: '^[0-9]{6}$'
          example: "123456"

    EmailVerificationTokenResponse:
      type: object
      required: [emailVerificationToken, expiresIn]
      properties:
        emailVerificationToken:
          type: string
          description: 회원가입 요청에 포함할 이메일 인증 완료 토큰
          example: "evt_3f9a1c..."
        expiresIn:
          type: integer
          description: 토큰 만료까지 남은 시간(초)
          example: 1800

    SignUpRequest:
      type: object
      required: [email, password, name, phoneNumber, birthDate, emailVerificationToken]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: 8~64자
          example: "password123!"
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "홍길동"
        phoneNumber:
          type: string
          description: 하이픈 없는 휴대폰 번호
          pattern: '^01[0-9]{8,9}$'
          example: "01012345678"
        birthDate:
          type: string
          format: date
          description: 생년월일 (나이는 서버에서 계산)
          example: "1990-01-31"
        address:
          type: string
          maxLength: 200
          description: 주소 (선택)
          example: "서울특별시 강남구 테헤란로 123"
        emailVerificationToken:
          type: string
          description: 이메일 인증 확인 API에서 발급받은 토큰
          example: "evt_3f9a1c..."

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "password123!"

    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiJ9..."
        expiresIn:
          type: integer
          description: Access Token 만료까지 남은 시간(초)
          example: 3600

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"

    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: 재설정 메일로 받은 토큰
          example: "prt_8b2d7e..."
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: "newPassword123!"

    # ===== 회원 =====
    MemberRole:
      type: string
      description: |
        회원 역할 (ADMIN 관리자, INSTRUCTOR 강사, MEMBER 회원).
        Access Token(JWT)에 역할이 포함되며, 서버는 이를 기준으로 권한을 판단한다. 권한이 없으면 403.
        공개 회원가입은 MEMBER만 생성하고, INSTRUCTOR와 ADMIN은 관리자가 등록한다.
        계정 상태가 ACTIVE가 아니면 로그인할 수 없다.
      enum: [ADMIN, INSTRUCTOR, MEMBER]
      example: "MEMBER"

    MemberStatus:
      type: string
      description: |
        계정 상태 (ACTIVE 정상, INACTIVE 관리자가 비활성화, WITHDRAWN 본인 탈퇴, RESIGNED 강사 퇴사).
        ACTIVE가 아니면 로그인할 수 없다.
      enum: [ACTIVE, INACTIVE, WITHDRAWN, RESIGNED]
      example: "ACTIVE"

    Member:
      type: object
      required: [id, email, name, phoneNumber, birthDate, role, status, permissions, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: "user@example.com"
        role:
          $ref: '#/components/schemas/MemberRole'
        status:
          $ref: '#/components/schemas/MemberStatus'
        permissions:
          type: array
          description: 명시적으로 부여된 권한. 관리자(ADMIN)는 암묵적으로 모든 권한을 가지므로 빈 배열이다.
          items:
            $ref: '#/components/schemas/PermissionCode'
        resignationDate:
          type: string
          format: date
          nullable: true
          description: 강사의 퇴사일 (센터 현지 날짜). 퇴사일 등록 후 값이 있고, 등록하지 않았거나 강사가 아니면 null이다.
          example: null
        name:
          type: string
          example: "홍길동"
        phoneNumber:
          type: string
          example: "01012345678"
        birthDate:
          type: string
          format: date
          example: "1990-01-31"
        address:
          type: string
          nullable: true
          example: "서울특별시 강남구 테헤란로 123"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-05T04:10:00Z"

    MemberPageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    MemberCreateRequest:
      type: object
      required: [email, name, phoneNumber, birthDate, role]
      properties:
        email:
          type: string
          format: email
          example: "instructor@example.com"
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "김강사"
        phoneNumber:
          type: string
          description: 하이픈 없는 휴대폰 번호
          pattern: '^01[0-9]{8,9}$'
          example: "01012345678"
        birthDate:
          type: string
          format: date
          example: "1990-01-31"
        address:
          type: string
          maxLength: 200
          description: 주소 (선택)
          example: "서울특별시 강남구 테헤란로 123"
        role:
          type: string
          description: 등록할 역할 (회원은 공개 가입으로만 생성)
          enum: [ADMIN, INSTRUCTOR]
          example: "INSTRUCTOR"

    MemberAdminUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "홍길동"
        phoneNumber:
          type: string
          description: 하이픈 없는 휴대폰 번호
          pattern: '^01[0-9]{8,9}$'
          example: "01012345678"
        birthDate:
          type: string
          format: date
          example: "1990-01-31"
        address:
          type: string
          maxLength: 200
          nullable: true
          description: null이면 주소 삭제
          example: "서울특별시 강남구 테헤란로 123"
        role:
          $ref: '#/components/schemas/MemberRole'

    MemberStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: 변경할 상태 (WITHDRAWN, RESIGNED는 지정할 수 없다). 탈퇴나 퇴사한 계정은 ACTIVE로만 되돌릴 수 있다.
          enum: [ACTIVE, INACTIVE]
          example: "INACTIVE"

    MemberUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "홍길동"
        phoneNumber:
          type: string
          description: 하이픈 없는 휴대폰 번호
          pattern: '^01[0-9]{8,9}$'
          example: "01012345678"
        birthDate:
          type: string
          format: date
          example: "1990-01-31"
        address:
          type: string
          maxLength: 200
          nullable: true
          description: null이면 주소 삭제
          example: "서울특별시 강남구 테헤란로 123"

    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          example: "password123!"
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: "newPassword123!"

    # ===== 강사 수당 단가 / 정산 =====
    PayRate:
      type: object
      required: [lessonType, unitPrice]
      properties:
        lessonType:
          $ref: '#/components/schemas/LessonTypeSummary'
        unitPrice:
          type: integer
          format: int64
          description: 수업당 단가 (원)
          example: 30000

    PayRatesResponse:
      type: object
      required: [instructor, payRates]
      properties:
        instructor:
          $ref: '#/components/schemas/InstructorSummary'
        payRates:
          type: array
          items:
            $ref: '#/components/schemas/PayRate'

    PayRateInput:
      type: object
      required: [lessonTypeId, unitPrice]
      properties:
        lessonTypeId:
          type: integer
          format: int64
          example: 1
        unitPrice:
          type: integer
          format: int64
          minimum: 0
          description: 수업당 단가 (원)
          example: 30000

    PayRatesRequest:
      type: object
      required: [payRates]
      properties:
        payRates:
          type: array
          description: 수업 유형은 중복될 수 없다. 빈 배열이면 모든 단가를 삭제한다.
          items:
            $ref: '#/components/schemas/PayRateInput'

    SettlementStatus:
      type: string
      description: |
        정산 상태.
        - CALCULATED: 계산됨
        - REVIEW_REQUESTED: 검토 요청됨
        - CONFIRMED: 확정됨 (금액 변경 불가)
        - PAID: 지급 기록됨 (외부 지급)
      enum: [CALCULATED, REVIEW_REQUESTED, CONFIRMED, PAID]
      example: "CALCULATED"

    SettlementPayment:
      type: object
      required: [paidAt, recordedAt]
      properties:
        paidAt:
          type: string
          format: date
          description: 실제 지급일 (센터 현지 날짜)
          example: "2026-11-05"
        memo:
          type: string
          nullable: true
          example: "계좌이체"
        recordedAt:
          type: string
          format: date-time
          description: 지급 기록을 남긴 시각
          example: "2026-11-05T09:00:00Z"

    Settlement:
      type: object
      required: [id, instructor, periodStart, periodEnd, status, totalAmount, settledLessonCount, excludedLessonCount, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        instructor:
          $ref: '#/components/schemas/InstructorSummary'
        periodStart:
          type: string
          format: date
          description: 정산 기간 시작일 (센터 현지 날짜, 포함)
          example: "2026-10-01"
        periodEnd:
          type: string
          format: date
          description: 정산 기간 종료일 (센터 현지 날짜, 포함)
          example: "2026-10-31"
        status:
          $ref: '#/components/schemas/SettlementStatus'
        totalAmount:
          type: integer
          format: int64
          description: 정산 금액 합계 (원)
          example: 900000
        settledLessonCount:
          type: integer
          description: 금액이 계산된 수업 수
          example: 30
        excludedLessonCount:
          type: integer
          description: 미정산 처리된 수업 수 (취소되지 않은 예약이 없는 수업)
          example: 2
        createdAt:
          type: string
          format: date-time
          description: 계산한 시각
          example: "2026-11-02T01:00:00Z"
        reviewRequestedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        confirmedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        payment:
          type: object
          allOf:
            - $ref: '#/components/schemas/SettlementPayment'
          nullable: true
          description: 지급 기록. 상태가 PAID일 때만 값이 있다.

    SettlementItem:
      type: object
      required: [lesson, attendedCount, noShowCount, amount, settled]
      properties:
        lesson:
          $ref: '#/components/schemas/LessonSummary'
        attendedCount:
          type: integer
          description: 출석 인원
          example: 3
        noShowCount:
          type: integer
          description: 노쇼 인원
          example: 1
        unitPrice:
          type: integer
          format: int64
          nullable: true
          description: 계산 시점의 단가 (원). 미정산 수업은 null이다.
          example: 30000
        amount:
          type: integer
          format: int64
          description: 수업 금액 (원). 미정산 수업은 0이다.
          example: 30000
        settled:
          type: boolean
          description: 금액이 계산되었는지 여부
          example: true
        excludedReason:
          type: string
          nullable: true
          description: |
            미정산 사유.
            - NO_RESERVATION: 취소되지 않은 예약이 한 건도 없어 수업이 진행되지 않음
          enum: [NO_RESERVATION]
          example: null

    SettlementDetail:
      allOf:
        - $ref: '#/components/schemas/Settlement'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: 수업별 정산 내역 (수업 시작 시각 오름차순)
              items:
                $ref: '#/components/schemas/SettlementItem'

    SettlementPageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Settlement'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    SettlementCreateRequest:
      type: object
      required: [instructorId, periodStart, periodEnd]
      properties:
        instructorId:
          type: integer
          format: int64
          description: 정산할 강사 회원 ID
          example: 2
        periodStart:
          type: string
          format: date
          description: 정산 기간 시작일 (센터 현지 날짜, 포함)
          example: "2026-10-01"
        periodEnd:
          type: string
          format: date
          description: 정산 기간 종료일 (센터 현지 날짜, 포함). 오늘보다 과거여야 한다.
          example: "2026-10-31"

    SettlementPaymentRequest:
      type: object
      required: [paidAt]
      properties:
        paidAt:
          type: string
          format: date
          description: 실제 지급일 (센터 현지 날짜)
          example: "2026-11-05"
        memo:
          type: string
          maxLength: 200
          example: "계좌이체"

    # ===== 강사: 가능시간 / 부재 / 퇴사 / 인계 =====
    AvailabilitySlot:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        startTime:
          type: string
          description: 시작 시각. 센터 현지 시각(Asia/Seoul) HH:mm.
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "10:00"
        endTime:
          type: string
          description: 종료 시각. 센터 현지 시각(Asia/Seoul) HH:mm.
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "18:00"

    AvailabilityRequest:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          description: 요일별 가능 시간대 목록. 같은 요일에 여러 개를 둘 수 있으나 서로 겹칠 수 없다. 빈 배열이면 모든 요일이 불가이다.
          maxItems: 70
          items:
            $ref: '#/components/schemas/AvailabilitySlot'

    AvailabilityResponse:
      type: object
      required: [instructor, slots]
      properties:
        instructor:
          $ref: '#/components/schemas/InstructorSummary'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilitySlot'

    AbsenceStatus:
      type: string
      description: |
        부재 상태.
        - REQUESTED: 승인 대기
        - APPROVED: 승인됨 (기간에 수업 배정 불가)
        - REJECTED: 반려됨
        - CANCELED: 취소됨
      enum: [REQUESTED, APPROVED, REJECTED, CANCELED]
      example: "REQUESTED"

    Absence:
      type: object
      required: [id, instructor, startAt, endAt, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        instructor:
          $ref: '#/components/schemas/InstructorSummary'
        startAt:
          type: string
          format: date-time
          example: "2026-10-20T00:00:00Z"
        endAt:
          type: string
          format: date-time
          example: "2026-10-23T14:59:59Z"
        reason:
          type: string
          nullable: true
          description: 신청 사유
          example: "휴가"
        status:
          $ref: '#/components/schemas/AbsenceStatus'
        rejectReason:
          type: string
          nullable: true
          description: 반려 사유. 상태가 REJECTED이고 사유를 입력한 경우에만 값이 있다.
          example: null
        processedBy:
          type: object
          allOf:
            - $ref: '#/components/schemas/MemberSummary'
          nullable: true
          description: 승인, 반려, 취소를 처리한 사람. 처리 전이면 null이다.
        processedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-10-05T04:10:00Z"

    AbsencePageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Absence'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    AbsenceCreateRequest:
      type: object
      required: [startAt, endAt]
      properties:
        startAt:
          type: string
          format: date-time
          description: 부재 시작 시각 (UTC). 과거일 수 없다.
          example: "2026-10-20T00:00:00Z"
        endAt:
          type: string
          format: date-time
          description: 부재 종료 시각 (UTC). 시작 시각보다 늦어야 한다.
          example: "2026-10-23T14:59:59Z"
        reason:
          type: string
          maxLength: 200
          description: 신청 사유 (선택)
          example: "휴가"

    AbsenceRejectRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
          description: 반려 사유 (선택). 신청한 강사에게 보인다.
          example: "해당 기간 수업이 많아 어렵습니다."

    ResignationRequest:
      type: object
      required: [resignationDate]
      properties:
        resignationDate:
          type: string
          format: date
          description: 퇴사일 (센터 현지 날짜). 오늘이거나 미래여야 한다.
          example: "2026-11-30"

    LessonReassignmentRequest:
      type: object
      required: [toInstructorId]
      properties:
        toInstructorId:
          type: integer
          format: int64
          description: 수업을 넘겨받을 강사 회원 ID
          example: 5
        from:
          type: string
          format: date-time
          description: 이 시각 이후에 시작하는 수업만 넘긴다 (UTC). 생략하면 현재 시각이다.
          example: "2026-12-01T00:00:00Z"

    LessonReassignmentResponse:
      type: object
      required: [reassignedCount]
      properties:
        reassignedCount:
          type: integer
          description: 인계된 수업 수
          example: 12

    # ===== 알림 =====
    Notification:
      type: object
      required: [id, type, title, message, read, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        type:
          type: string
          description: |
            알림 종류. 기능이 추가되면 값이 늘어날 수 있으므로 클라이언트는 알 수 없는 값도 그대로 표시할 수 있어야 한다.
            현재 정의된 값은 다음과 같다.
            - LESSON_CANCELED: 예약한 수업이 취소됨
            - RESERVATION_CANCELED: 관리자가 예약을 취소함
            - ABSENCE_REQUESTED: 강사가 부재를 신청함 (관리자에게 발송)
            - ABSENCE_APPROVED: 부재가 승인됨 (신청한 강사에게 발송)
            - ABSENCE_REJECTED: 부재가 반려됨 (신청한 강사에게 발송)
          example: "LESSON_CANCELED"
        title:
          type: string
          example: "수업이 취소되었습니다"
        message:
          type: string
          example: "10월 12일 10:00 아침 매트 필라테스 수업이 취소되어 예약이 취소되고 이용권 횟수가 복구되었습니다."
        relatedType:
          type: string
          nullable: true
          description: 관련 대상 종류. 화면에서 해당 대상으로 이동하는 데 사용한다. 예 LESSON, RESERVATION
          example: "LESSON"
        relatedId:
          type: integer
          format: int64
          nullable: true
          example: 15
        read:
          type: boolean
          example: false
        readAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-10-05T04:10:00Z"

    NotificationPageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    UnreadNotificationCountResponse:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          example: 3

    # ===== 활동 이력 =====
    ActivityActor:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
          format: int64
          example: 2
        name:
          type: string
          example: "김강사"
        role:
          $ref: '#/components/schemas/MemberRole'

    ActivityChange:
      type: object
      required: [field]
      properties:
        field:
          type: string
          description: 변경된 필드명
          example: "startAt"
        before:
          type: string
          nullable: true
          description: 변경 전 값 (개인정보는 마스킹, 비밀번호와 토큰은 기록하지 않음)
          example: "2026-10-12T01:00:00Z"
        after:
          type: string
          nullable: true
          description: 변경 후 값
          example: "2026-10-12T02:00:00Z"

    ActivityLog:
      type: object
      required: [id, occurredAt, category, action, actionName, summary, changes]
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        occurredAt:
          type: string
          format: date-time
          example: "2026-10-05T04:10:00Z"
        category:
          type: string
          description: 카테고리 (이력을 묶는 태그). 예 AUTH, MEMBER, PERMISSION, LESSON, RESERVATION, ATTENDANCE, PASS, PAYMENT, PASS_PRODUCT, LESSON_TYPE, ROOM, BUSINESS_HOUR, POLICY, PAY_RATE, SETTLEMENT, INSTRUCTOR, ABSENCE
          example: "LESSON"
        action:
          type: string
          description: 행위 코드. 예 LESSON_CREATED, LESSON_UPDATED, LESSON_CANCELED, RESERVATION_CREATED, PASS_ISSUED
          example: "LESSON_UPDATED"
        actionName:
          type: string
          description: 화면에 표시할 행위 이름
          example: "수업 수정"
        actor:
          type: object
          allOf:
            - $ref: '#/components/schemas/ActivityActor'
          nullable: true
          description: 행위자. 시스템이 자동으로 수행한 처리(공개 예약 시각의 자동 공개, 이용권 만료)나 식별되지 않은 로그인 실패는 null이다.
        subjectMember:
          type: object
          allOf:
            - $ref: '#/components/schemas/MemberSummary'
          nullable: true
          description: 행동의 영향을 받은 회원. 예를 들어 관리자가 회원 이용권을 수정하면 그 회원이다. 해당 없으면 null이다.
        targetType:
          type: string
          nullable: true
          description: 대상 종류. 예 MEMBER, LESSON, RESERVATION, PASS, PASS_PAYMENT, PASS_PAUSE, PASS_PRODUCT, LESSON_TYPE, ROOM, BUSINESS_HOURS, RESERVATION_POLICY, SETTLEMENT, ABSENCE. 대상이 없는 이벤트는 null이다.
          example: "LESSON"
        targetId:
          type: integer
          format: int64
          nullable: true
          example: 15
        summary:
          type: string
          description: 사람이 읽을 수 있는 한 줄 요약
          example: "김강사가 수업 '아침 매트 필라테스'의 강사를 변경했다."
        changes:
          type: array
          description: 변경 전후 값 목록. 변경 값이 없는 이벤트는 빈 배열이다.
          items:
            $ref: '#/components/schemas/ActivityChange'

    ActivityLogPageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ActivityLog'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    ActivityLogAction:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: "LESSON_CANCELED"
        name:
          type: string
          example: "수업 취소"

    ActivityLogCategory:
      type: object
      required: [code, name, actions]
      properties:
        code:
          type: string
          example: "LESSON"
        name:
          type: string
          example: "수업"
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActivityLogAction'

    ActivityLogActionCatalogResponse:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ActivityLogCategory'

    # ===== 예약 / 출결 =====
    ReservationStatus:
      type: string
      description: |
        예약 상태.
        - RESERVED: 예약됨 (확정, 이용권 횟수 차감됨)
        - ATTENDED: 출석
        - NO_SHOW: 노쇼 (횟수는 차감된 채 유지)
        - CANCELED: 취소됨 (횟수 복구됨)
      enum: [RESERVED, ATTENDED, NO_SHOW, CANCELED]
      example: "RESERVED"

    LessonSummary:
      type: object
      required: [id, title, startAt, endAt, status]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "아침 매트 필라테스"
        lessonType:
          $ref: '#/components/schemas/LessonTypeSummary'
        instructor:
          $ref: '#/components/schemas/InstructorSummary'
        room:
          $ref: '#/components/schemas/RoomSummary'
        startAt:
          type: string
          format: date-time
          example: "2026-10-12T01:00:00Z"
        endAt:
          type: string
          format: date-time
          example: "2026-10-12T02:00:00Z"
        status:
          $ref: '#/components/schemas/LessonStatus'

    PassSummary:
      type: object
      required: [id, passProduct, endDate]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        passProduct:
          $ref: '#/components/schemas/PassProductSummary'
        endDate:
          type: string
          format: date
          description: 만료일 (센터 현지 날짜)
          example: "2026-11-03"

    Reservation:
      type: object
      required: [id, lesson, member, pass, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        lesson:
          $ref: '#/components/schemas/LessonSummary'
        member:
          $ref: '#/components/schemas/MemberSummary'
        pass:
          $ref: '#/components/schemas/PassSummary'
        status:
          $ref: '#/components/schemas/ReservationStatus'
        attendanceConfirmedAt:
          type: string
          format: date-time
          nullable: true
          description: 출결을 마지막으로 기록(정정 포함)한 시각
          example: null
        canceledBy:
          type: string
          nullable: true
          description: |
            취소 주체. 상태가 CANCELED일 때만 값이 있다.
            - MEMBER: 회원 본인
            - ADMIN: 관리자
            - LESSON_CANCELED: 수업 취소로 인한 자동 취소
          enum: [MEMBER, ADMIN, LESSON_CANCELED]
          example: null
        canceledAt:
          type: string
          format: date-time
          nullable: true
          example: null
        cancelReason:
          type: string
          nullable: true
          description: 취소 사유. 취소 요청에 입력했거나 수업 취소 사유가 있는 경우에만 값이 있다.
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-10-05T04:10:00Z"

    ReservationPageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    ReservationCreateRequest:
      type: object
      required: [lessonId]
      properties:
        lessonId:
          type: integer
          format: int64
          example: 1

    ReservationCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
          description: 취소 사유 (선택)
          example: "일정 변경"

    AttendanceRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ATTENDED, NO_SHOW]
          example: "ATTENDED"

    ReservationPolicy:
      type: object
      required: [cancelDeadlineHours, allowUnpaidReservation]
      properties:
        cancelDeadlineHours:
          type: integer
          minimum: 0
          maximum: 720
          description: 회원이 예약을 취소할 수 있는 마감 시간. 수업 시작 몇 시간 전까지인지를 뜻한다. 0이면 시작 직전까지 가능하다.
          example: 24
        allowUnpaidReservation:
          type: boolean
          description: 결제를 모두 마치지 않은(미수) 이용권으로도 예약을 허용할지 여부. false이면 완납한 이용권으로만 예약할 수 있다.
          example: true

    # ===== 이용권 상품 =====
    PassProduct:
      type: object
      required: [id, name, price, totalCount, validityDays, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "필라테스 10회권"
        price:
          type: integer
          format: int64
          description: 가격 (원)
          example: 300000
        totalCount:
          type: integer
          description: 총 횟수
          example: 10
        validityDays:
          type: integer
          description: 유효 기간 (일)
          example: 30
        description:
          type: string
          nullable: true
          example: "기간 내 10회 이용 가능"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-05T04:10:00Z"

    PassProductPageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PassProduct'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    PassProductCreateRequest:
      type: object
      required: [name, price, totalCount, validityDays]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "필라테스 10회권"
        price:
          type: integer
          format: int64
          minimum: 0
          description: 가격 (원)
          example: 300000
        totalCount:
          type: integer
          minimum: 1
          maximum: 1000
          description: 총 횟수
          example: 10
        validityDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: 유효 기간 (일)
          example: 30
        description:
          type: string
          maxLength: 500
          example: "기간 내 10회 이용 가능"

    PassProductUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "필라테스 10회권"
        price:
          type: integer
          format: int64
          minimum: 0
          description: 가격 (원). 발급된 이용권에는 영향이 없다.
          example: 300000
        totalCount:
          type: integer
          minimum: 1
          maximum: 1000
          description: 총 횟수. applyToIssued가 true일 때만 발급된 이용권에 반영된다.
          example: 12
        validityDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: 유효 기간 (일). applyToIssued가 true일 때만 발급된 이용권에 반영된다.
          example: 30
        description:
          type: string
          maxLength: 500
          nullable: true
          example: "기간 내 10회 이용 가능"
        applyToIssued:
          type: boolean
          default: false
          description: 총 횟수와 유효 기간 변경을 이미 발급된 이용권(만료되지 않은 것)에도 반영할지 여부
          example: false

    PassProductUpdateResponse:
      type: object
      required: [passProduct, affectedPassCount]
      properties:
        passProduct:
          $ref: '#/components/schemas/PassProduct'
        affectedPassCount:
          type: integer
          description: 총 횟수와 유효 기간 변경이 반영된 발급 이용권 수. applyToIssued가 false이면 0이다.
          example: 0

    # ===== 이용권 =====
    PassStatus:
      type: string
      description: |
        이용권 상태.
        - UPCOMING: 시작 전 (시작일이 미래)
        - ACTIVE: 사용 중
        - PAUSED: 일시정지 중 (정지 기간에 속한 날, 예약 불가)
        - EXPIRED: 만료됨 (만료일이 지나면 서버가 자동으로 전환)
        횟수가 모두 소진되어도 상태는 바뀌지 않는다 (잔여 횟수가 0인 것으로 판단).
        정지 시작과 종료, 만료는 서버가 날짜에 맞춰 자동으로 전환한다.
      enum: [UPCOMING, ACTIVE, PAUSED, EXPIRED]
      example: "ACTIVE"

    MemberSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 3
        name:
          type: string
          example: "홍길동"

    PassProductSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "필라테스 10회권"

    Pass:
      type: object
      required: [id, passProduct, member, instructor, price, paidAmount, unpaidAmount, paymentStatus, totalCount, remainingCount, startDate, endDate, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        passProduct:
          $ref: '#/components/schemas/PassProductSummary'
        member:
          $ref: '#/components/schemas/MemberSummary'
        instructor:
          $ref: '#/components/schemas/InstructorSummary'
        price:
          type: integer
          format: int64
          description: 이용권 금액 (원). 발급할 때 지정하지 않았으면 발급 시점의 상품 가격이다.
          example: 300000
        paidAmount:
          type: integer
          format: int64
          description: 기록된 결제 금액의 합계 (원). 환불로 체크된 기록도 포함한다 (환불은 금액에 자동 반영되지 않는다).
          example: 100000
        unpaidAmount:
          type: integer
          format: int64
          description: 미수금 (원). 이용권 금액에서 결제 합계를 뺀 값이다.
          example: 200000
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        totalCount:
          type: integer
          description: 총 횟수
          example: 10
        remainingCount:
          type: integer
          description: |
            잔여 횟수. 예약할 때 1회 차감되고, 예약이 취소되면 복구된다.
            복구는 횟수만 증가시키며 기간에는 영향이 없다 (만료된 이용권도 마찬가지).
          example: 7
        startDate:
          type: string
          format: date
          description: 시작일 (센터 현지 날짜, Asia/Seoul)
          example: "2026-10-05"
        endDate:
          type: string
          format: date
          description: 만료일 (센터 현지 날짜). 당일 끝까지 사용할 수 있다. 일시정지로 연장된 일수가 포함된다.
          example: "2026-11-03"
        status:
          $ref: '#/components/schemas/PassStatus'
        createdAt:
          type: string
          format: date-time
          example: "2026-10-05T04:10:00Z"

    PaymentStatus:
      type: string
      description: |
        결제 상태.
        - UNPAID: 미결제 (결제 기록이 없고 이용권 금액이 0보다 큼)
        - PARTIAL: 일부 결제 (미수금이 남아 있음)
        - PAID: 완납 (이용권 금액이 0인 경우 포함)
      enum: [UNPAID, PARTIAL, PAID]
      example: "PARTIAL"

    PaymentMethod:
      type: string
      description: 결제 수단 (CARD 카드, CASH 현금, TRANSFER 계좌이체, OTHER 기타)
      enum: [CARD, CASH, TRANSFER, OTHER]
      example: "CARD"

    PassPayment:
      type: object
      required: [id, method, amount, paidAt, refunded, member, pass, recordedBy, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          type: integer
          format: int64
          description: 결제 금액 (원)
          example: 100000
        paidAt:
          type: string
          format: date
          description: 결제일 (센터 현지 날짜)
          example: "2026-10-05"
        memo:
          type: string
          nullable: true
          example: "1차 결제"
        refunded:
          type: boolean
          description: 환불로 체크되었는지 여부. 체크해도 이용권, 예약, 미수금은 자동으로 바뀌지 않는다.
          example: false
        refundedAt:
          type: string
          format: date
          nullable: true
          description: 환불일 (센터 현지 날짜). 환불로 체크된 경우에만 값이 있다.
          example: null
        refundMemo:
          type: string
          nullable: true
          description: 환불 메모. 환불로 체크하면서 입력한 경우에만 값이 있다.
          example: null
        member:
          $ref: '#/components/schemas/MemberSummary'
        pass:
          $ref: '#/components/schemas/PassSummary'
        recordedBy:
          $ref: '#/components/schemas/MemberSummary'
        createdAt:
          type: string
          format: date-time
          description: 기록한 시각
          example: "2026-10-05T04:10:00Z"

    PassPaymentPageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PassPayment'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    PassPaymentCreateRequest:
      type: object
      required: [method, amount, paidAt]
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          type: integer
          format: int64
          minimum: 1
          description: 결제 금액 (원)
          example: 100000
        paidAt:
          type: string
          format: date
          description: 결제일 (센터 현지 날짜). 오늘보다 미래일 수 없다.
          example: "2026-10-05"
        memo:
          type: string
          maxLength: 200
          example: "1차 결제"

    PassPaymentUpdateRequest:
      type: object
      minProperties: 1
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          type: integer
          format: int64
          minimum: 1
          description: 결제 금액 (원)
          example: 100000
        paidAt:
          type: string
          format: date
          description: 결제일 (센터 현지 날짜). 오늘보다 미래일 수 없다.
          example: "2026-10-05"
        memo:
          type: string
          maxLength: 200
          nullable: true
          description: 메모. null이면 지운다.
          example: "1차 결제"

    PassPaymentRefundRequest:
      type: object
      required: [refunded]
      properties:
        refunded:
          type: boolean
          description: true이면 환불로 체크하고, false이면 체크를 해제한다.
          example: true
        refundedAt:
          type: string
          format: date
          description: 환불일 (센터 현지 날짜). refunded가 true일 때만 쓰이며 생략하면 오늘이다.
          example: "2026-10-12"
        memo:
          type: string
          maxLength: 200
          description: 환불 메모 (선택). refunded가 true일 때만 쓰인다.
          example: "고객 요청으로 카드 취소"

    PassPauseStatus:
      type: string
      description: |
        일시정지 상태.
        - SCHEDULED: 시작 전 (시작일이 미래)
        - ACTIVE: 진행 중
        - ENDED: 종료됨 (정해진 기간이 끝났거나 조기 해제됨)
        - CANCELED: 취소됨 (시작 전에 해제했거나 시작일 당일에 해제함)
      enum: [SCHEDULED, ACTIVE, ENDED, CANCELED]
      example: "SCHEDULED"

    PassPause:
      type: object
      required: [id, startDate, endDate, days, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        startDate:
          type: string
          format: date
          description: 정지 시작일 (센터 현지 날짜, 포함)
          example: "2026-10-20"
        endDate:
          type: string
          format: date
          description: 정지 종료일 (센터 현지 날짜, 포함). 조기 해제되면 해제 전날로 바뀐다.
          example: "2026-10-26"
        days:
          type: integer
          description: 정지 일수 (`종료일 - 시작일 + 1`). 취소된 정지는 0이다.
          example: 7
        status:
          $ref: '#/components/schemas/PassPauseStatus'
        reason:
          type: string
          nullable: true
          description: 정지 사유
          example: "개인 사정"
        terminatedAt:
          type: string
          format: date-time
          nullable: true
          description: 조기 해제하거나 취소한 시각
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-10-05T04:10:00Z"

    PassPausePageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PassPause'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    PassPauseCreateRequest:
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
          description: 정지 시작일 (센터 현지 날짜). 오늘이거나 미래여야 한다.
          example: "2026-10-20"
        endDate:
          type: string
          format: date
          description: 정지 종료일 (센터 현지 날짜). 시작일과 같거나 이후여야 한다.
          example: "2026-10-26"
        reason:
          type: string
          maxLength: 200
          description: 정지 사유 (선택)
          example: "개인 사정"

    PassPageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Pass'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    PassCreateRequest:
      type: object
      required: [passProductId, memberId, instructorId, startDate]
      properties:
        passProductId:
          type: integer
          format: int64
          example: 1
        memberId:
          type: integer
          format: int64
          description: 발급받을 회원 ID
          example: 3
        instructorId:
          type: integer
          format: int64
          description: 담당 강사 ID (회원마다 다르게 지정한다)
          example: 2
        startDate:
          type: string
          format: date
          description: 시작일 (센터 현지 날짜). 오늘이거나 미래, 또는 과거도 가능하다.
          example: "2026-10-05"
        price:
          type: integer
          format: int64
          minimum: 0
          description: 이용권 금액 (원). 생략하면 상품 가격이 쓰인다. 할인 등으로 다르게 받을 때 지정한다.
          example: 270000

    PassUpdateRequest:
      type: object
      minProperties: 1
      properties:
        endDate:
          type: string
          format: date
          description: 만료일 (센터 현지 날짜)
          example: "2026-11-03"
        remainingCount:
          type: integer
          minimum: 0
          description: 잔여 횟수 (총 횟수를 넘을 수 없다)
          example: 7
        instructorId:
          type: integer
          format: int64
          description: 담당 강사 ID
          example: 2

    # ===== 수업 =====
    LessonStatus:
      type: string
      description: |
        수업 상태.
        - CREATED: 개설됨 (비공개)
        - SCHEDULED: 공개 예약됨 (`publishAt`에 자동 공개)
        - PUBLISHED: 공개됨
        - UNPUBLISHED: 비공개됨
        - CANCELED: 취소됨 (되돌릴 수 없음, 시간 점유 해제)
      enum: [CREATED, SCHEDULED, PUBLISHED, UNPUBLISHED, CANCELED]
      example: "PUBLISHED"

    LessonTypeSummary:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          example: "GROUP_3"
        name:
          type: string
          example: "단체 3:1"

    InstructorSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 2
        name:
          type: string
          example: "김강사"

    InstructorPageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/InstructorSummary'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    RoomSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "A룸"

    Lesson:
      type: object
      required: [id, title, lessonType, instructor, room, startAt, endAt, capacity, reservedCount, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "아침 매트 필라테스"
        lessonType:
          $ref: '#/components/schemas/LessonTypeSummary'
        instructor:
          $ref: '#/components/schemas/InstructorSummary'
        room:
          $ref: '#/components/schemas/RoomSummary'
        startAt:
          type: string
          format: date-time
          example: "2026-10-12T01:00:00Z"
        endAt:
          type: string
          format: date-time
          example: "2026-10-12T02:00:00Z"
        capacity:
          type: integer
          description: 정원 (개설 시점의 수업 유형 정원)
          example: 3
        reservedCount:
          type: integer
          description: 현재 예약 인원 (취소되지 않은 예약 수). 정원에서 빼면 남은 자리이다.
          example: 2
        status:
          $ref: '#/components/schemas/LessonStatus'
        publishAt:
          type: string
          format: date-time
          nullable: true
          description: 공개 예약 시각. 상태가 SCHEDULED일 때만 값이 있다.
          example: null
        canceledAt:
          type: string
          format: date-time
          nullable: true
          description: 취소 시각. 상태가 CANCELED일 때만 값이 있다.
          example: null
        cancelReason:
          type: string
          nullable: true
          description: 취소 사유. 상태가 CANCELED이고 사유를 입력한 경우에만 값이 있다.
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-10-05T04:10:00Z"

    LessonPageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    LessonCreateRequest:
      type: object
      required: [title, lessonTypeId, instructorId, roomId, startAt, endAt]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: "아침 매트 필라테스"
        lessonTypeId:
          type: integer
          format: int64
          example: 1
        instructorId:
          type: integer
          format: int64
          description: 담당 강사 회원 ID
          example: 2
        roomId:
          type: integer
          format: int64
          example: 1
        startAt:
          type: string
          format: date-time
          example: "2026-10-12T01:00:00Z"
        endAt:
          type: string
          format: date-time
          example: "2026-10-12T02:00:00Z"

    LessonUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: "아침 매트 필라테스"
        instructorId:
          type: integer
          format: int64
          example: 2
        roomId:
          type: integer
          format: int64
          example: 1
        startAt:
          type: string
          format: date-time
          example: "2026-10-12T01:00:00Z"
        endAt:
          type: string
          format: date-time
          example: "2026-10-12T02:00:00Z"

    LessonCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
          description: 취소 사유 (선택)
          example: "강사 사정으로 취소"

    LessonStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: 변경할 상태 (CREATED로는 변경할 수 없다)
          enum: [PUBLISHED, UNPUBLISHED, SCHEDULED]
          example: "SCHEDULED"
        publishAt:
          type: string
          format: date-time
          description: 공개 예약 시각 (UTC). status가 SCHEDULED일 때만 필수이며 그 외에는 보내면 안 된다.
          example: "2026-10-10T00:00:00Z"

    # ===== 수업 유형 =====
    LessonType:
      type: object
      required: [id, code, name, capacity, active, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          description: 영문 식별자 (등록 후 변경 불가, 권한 코드에 사용)
          example: "GROUP_3"
        name:
          type: string
          example: "단체 3:1"
        capacity:
          type: integer
          description: 정원
          example: 3
        active:
          type: boolean
          description: false이면 새 수업을 개설할 수 없다
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-10-05T04:10:00Z"

    LessonTypePageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/LessonType'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    LessonTypeCreateRequest:
      type: object
      required: [code, name, capacity]
      properties:
        code:
          type: string
          description: 대문자, 숫자, 밑줄만 허용 (2~30자, 대문자로 시작)
          pattern: '^[A-Z][A-Z0-9_]{1,29}$'
          example: "GROUP_3"
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "단체 3:1"
        capacity:
          type: integer
          minimum: 1
          maximum: 100
          description: 정원
          example: 3

    LessonTypeUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "단체 3:1"
        capacity:
          type: integer
          minimum: 1
          maximum: 100
          description: 정원 (기존 수업에는 영향 없음)
          example: 3
        active:
          type: boolean
          example: true

    # ===== 권한 =====
    PermissionCode:
      type: string
      description: |
        권한 코드. enum으로 고정하지 않으며 `GET /permissions`로 조회한다.
        형식은 `{권한}` 또는 `{권한}:{수업유형코드}`이다.
        - `MEMBER_READ`: 회원 목록/상세 조회
        - `LESSON_CREATE:{유형코드}`: 해당 수업 유형의 수업 개설 (예 `LESSON_CREATE:PRIVATE`)
        - `LESSON_UPDATE:{유형코드}`: 해당 수업 유형의 수업 수정, 공개 상태 변경, 취소
        수업 유형이 추가되면 해당 유형의 권한 코드가 목록에 자동으로 나타난다.
      pattern: '^[A-Z][A-Z_]*(:[A-Z][A-Z0-9_]*)?$'
      example: "LESSON_CREATE:PRIVATE"

    Permission:
      type: object
      required: [code, name]
      properties:
        code:
          $ref: '#/components/schemas/PermissionCode'
        name:
          type: string
          description: 화면에 표시할 이름
          example: "개인 수업 개설"
        description:
          type: string
          example: "개인 유형의 수업을 개설할 수 있다."

    PermissionListResponse:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    MemberPermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          description: 부여할 권한 코드 목록 (중복 불가, 빈 배열이면 전체 회수)
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionCode'

    MemberPermissionsResponse:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionCode'

    # ===== 룸 =====
    Room:
      type: object
      required: [id, name, capacity, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "A룸"
        capacity:
          type: integer
          description: 수용 인원
          example: 8
        createdAt:
          type: string
          format: date-time
          example: "2026-10-05T04:10:00Z"

    RoomPageResponse:
      type: object
      required: [content, pageInfo]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Room'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    RoomCreateRequest:
      type: object
      required: [name, capacity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "A룸"
        capacity:
          type: integer
          minimum: 1
          maximum: 100
          description: 수용 인원
          example: 8

    RoomUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "A룸"
        capacity:
          type: integer
          minimum: 1
          maximum: 100
          description: 수용 인원
          example: 8

    # ===== 영업시간 =====
    DayOfWeek:
      type: string
      enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
      example: "MON"

    BusinessHour:
      type: object
      required: [dayOfWeek, closed]
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        closed:
          type: boolean
          description: 휴무 여부. true이면 openTime/closeTime은 null이다.
          example: false
        openTime:
          type: string
          nullable: true
          description: 오픈 시각. 센터 현지 시각(Asia/Seoul) HH:mm. 이 API만 UTC가 아닌 현지 시각을 사용한다.
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "09:00"
        closeTime:
          type: string
          nullable: true
          description: 마감 시각. 센터 현지 시각(Asia/Seoul) HH:mm.
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "22:00"

    BusinessHoursRequest:
      type: object
      required: [businessHours]
      properties:
        businessHours:
          type: array
          description: 7개 요일 전체 (요일당 1개)
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/BusinessHour'

    BusinessHoursResponse:
      type: object
      required: [businessHours]
      properties:
        businessHours:
          type: array
          description: 7개 요일 전체 (월요일부터 일요일 순)
          items:
            $ref: '#/components/schemas/BusinessHour'

  responses:
    BadRequestError:
      description: 400 잘못된 요청 또는 유효성 검증 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: 401 인증 실패 또는 만료된 토큰
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: 403 리소스에 대한 접근 권한 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: 404 리소스를 찾을 수 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: "409 리소스 충돌 (예: 이미 가입된 이메일)"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 500 서버 내부 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
