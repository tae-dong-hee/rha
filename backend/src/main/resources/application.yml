spring:
  application:
    name: rha
  autoconfigure:
    exclude:
      # 계정은 members 테이블이 기준이다. 기본 사용자(임시 비밀번호)가 만들어지지 않게 한다.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rha}
    username: ${DB_USERNAME:rha}
    password: ${DB_PASSWORD:rha}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        one-indexed-parameters: true

rha:
  auth:
    jwt:
      # HS256 서명 키. 32바이트 이상이어야 한다. 운영에서는 반드시 환경변수로 교체한다.
      secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-in-production}

server:
  servlet:
    context-path: /v1
