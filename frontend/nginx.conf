# Production publishes this container only on 127.0.0.1:8080. The host
# Nginx overwrites these headers before forwarding a request.
map $http_x_forwarded_proto $rha_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

map $http_x_real_ip $rha_client_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Spring Boot API
    location /v1/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $rha_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $rha_forwarded_proto;
        proxy_set_header Forwarded "";
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
